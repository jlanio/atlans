# Pre-commit hooks for the atlans repo.
#
# Local setup (once per clone), in the environment where you run `git commit`
# (Linux, macOS or Windows; the backend environment, with both locks, will do):
#   pip install --require-hashes -r requirements-dev.txt
#   pre-commit install
#
# After that, every `git commit` runs the hooks below automatically.
# To run them manually on all files:
#   pre-commit run --all-files
#
# All hooks are `repo: local` with `language: system`: they run the
# tools from requirements-dev.txt — pre-commit, detect-secrets and
# pre-commit-hooks pinned, with hashes and the 14-day quarantine (see
# CONTRIBUTING, "Python dependencies (hashed locks)"). A remote repository hook,
# even pinned by SHA, pins only the hook's code: the environment pre-commit builds
# for it resolves dependencies on PyPI on the spot, at that day's newest version
# and without hashes — measured: idna and urllib3 published less than 14 days
# earlier were coming in. And it is precisely on the committer's machine that this code runs.
# The ids, entries and filters below are those of the original
# `.pre-commit-hooks.yaml` (detect-secrets v1.5.0, pre-commit-hooks v5.0.0).
#
# CI (.github/workflows/ci.yml) runs `detect-secrets scan` as a safety
# net — it catches commits from devs who forgot the local install.
#
# To regenerate the baseline after reviewing a new hit:
#   detect-secrets scan --baseline .secrets.baseline
# On Windows, prefix it with PYTHONUTF8=1: without it Python opens the
# files in cp1252, chokes on those with accents and silently skips them —
# the baseline comes out without them and CI (Linux, UTF-8) flags them as new hits.

repos:
  - repo: local
    hooks:
      # ── Secret scanning: bloqueia commits com PAT/JWT/API keys ──────────
      - id: detect-secrets
        name: Detect secrets
        entry: detect-secrets-hook
        language: system
        files: .*
        args: ['--baseline', '.secrets.baseline']
        # Package manager locks: full of hashes that give false
        # positives. .secrets.baseline: self-reference. catalogo/: 22 MB of
        # generated markdown (layer names, public WFS URLs) — just noise
        # for the scanner; the baseline excludes the folder with the same filter.
        exclude: |
          (?x)^(
            package-lock\.json|
            web/package-lock\.json|
            web/pnpm-lock\.yaml|
            \.secrets\.baseline|
            catalogo/.*
          )$

      # ── Basic file hygiene ────────────────────────────────────────────
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
        exclude: \.md$  # Markdown usa trailing space como hard break
      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
        exclude: \.svg$
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: system
        types: [yaml]
        # docker-compose uses !reset and other tags — check-yaml validates
        # standard syntax, so we skip compose files. Other YMLs, yes.
        exclude: docker-compose.*\.yml
      - id: check-added-large-files
        name: check for added large files
        entry: check-added-large-files
        language: system
        stages: [pre-commit, pre-push, manual]
        args: ['--maxkb=1024']  # >1MB bloqueia (usar Git LFS se preciso)
        # catalogo/: IBGE's Atributos.md has 4 MB of tables (9,759 layers).
        exclude: ^catalogo/
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: check-merge-conflict
        language: system
        types: [text]
      - id: mixed-line-ending
        name: mixed line ending
        entry: mixed-line-ending
        language: system
        types: [text]
        args: ['--fix=lf']

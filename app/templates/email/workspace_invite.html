<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#0a0a0a;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0a0a0a;padding:40px 0;">
    <tr><td align="center">
      <table width="480" cellpadding="0" cellspacing="0" style="background:#141414;border-radius:12px;border:1px solid #262626;padding:40px;">
        <!-- Logo -->
        <tr><td style="padding-bottom:24px;text-align:center;">
          <span style="font-size:28px;font-weight:700;color:#FF6A00;">Atlans</span>
        </td></tr>

        <!-- Titulo -->
        <tr><td style="padding-bottom:16px;">
          <h1 style="margin:0;font-size:22px;color:#f5f5f5;text-align:center;">Novo workspace compartilhado</h1>
        </td></tr>

        <!-- Corpo -->
        <tr><td style="padding-bottom:24px;color:#a3a3a3;font-size:15px;line-height:1.6;">
          Ola <strong style="color:#f5f5f5;">{{ username }}</strong>,<br><br>
          <strong style="color:#f5f5f5;">{{ invited_by }}</strong> adicionou voce ao workspace
          <strong style="color:#FF6A00;">{{ workspace_name }}</strong> com o papel de
          <strong style="color:#f5f5f5;">{{ role }}</strong>.
        </td></tr>

        <!-- Botao -->
        <tr><td align="center" style="padding-bottom:24px;">
          <a href="{{ app_url }}"
             style="display:inline-block;background:#FF6A00;color:#fff;font-size:16px;font-weight:600;
                    text-decoration:none;padding:14px 32px;border-radius:8px;">
            Abrir workspace
          </a>
        </td></tr>

        <!-- Rodape -->
        <tr><td style="padding-top:32px;border-top:1px solid #262626;color:#525252;font-size:12px;text-align:center;">
          Voce recebeu este e-mail porque foi adicionado a um workspace no Atlans.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>

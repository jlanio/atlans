name: Atlans App

# Os servidores de tiles da instalação (web/lib/fundos-do-mapa.ts e
# app/core/config.py). Vazios = só as ruas do OpenStreetMap, sem satélite. Vão
# para a API (que os injeta nos nós Carta) e para o web (o mapa e o globo).
x-mapa-env: &mapa-env
  MAPA_RUAS_URL: ${MAPA_RUAS_URL:-}
  MAPA_RUAS_CREDITO: ${MAPA_RUAS_CREDITO:-}
  MAPA_SATELITE_URL: ${MAPA_SATELITE_URL:-}
  MAPA_SATELITE_CREDITO: ${MAPA_SATELITE_CREDITO:-}
  MAPA_HIBRIDO_URL: ${MAPA_HIBRIDO_URL:-}
  MAPA_HIBRIDO_CREDITO: ${MAPA_HIBRIDO_CREDITO:-}

x-api-env: &api-env
  <<: *mapa-env
  TZ: ${TZ}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  # Contadores de rate limit por IP (app/core/rate_limiter.py). Vazio (padrao)
  # = o REDIS_URL acima, e os limites valem para a API inteira; `memory://`
  # volta para a memoria de cada worker (ver docs/operations.md).
  RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-}
  # Prazo de cada comando no banco, em segundos (app/core/config.py). Vazio =
  # 60 (o Postgres cancela) e 90 (o asyncpg desiste); 0 desliga.
  DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-}
  DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT:-}
  # Roteamento por politica de execucao (docs/specs/executor-isolation-routing.md).
  # `off` (padrao): a API roteia como sempre — executor apontado, depois o pool —
  # e o editor da politica e uma previa. `on`: niveis, reserva e ultimo recurso
  # passam a valer. Reversao = voltar para `off` e recriar o container.
  EXECUTOR_POLICY_ROUTING: ${EXECUTOR_POLICY_ROUTING:-off}
  APP_SECRET: ${APP_SECRET}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-http://localhost:9000}
  # Obrigatorias, sem padrao (`:?` para o compose parar sem elas): o MinIO e
  # publicado em S3_HOST, e um padrao seria uma senha publica.
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env (make bootstrap)}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env (make bootstrap)}
  MINIO_BUCKET: ${MINIO_BUCKET:-atlans-drive}
  MINIO_PRESIGN_EXPIRY: ${MINIO_PRESIGN_EXPIRY:-3600}
  # E-mail (app/services/email_transporte.py): resend, smtp ou log. Vazio = o
  # que estiver configurado — Resend com a chave, SMTP com o host, log sem eles.
  EMAIL_BACKEND: ${EMAIL_BACKEND:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SEGURANCA: ${SMTP_SEGURANCA:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  # Vazio = Atlans <noreply@host do FRONTEND_URL> (app/core/config.py).
  # RESEND_FROM_EMAIL é o nome antigo e continua valendo.
  EMAIL_FROM: ${EMAIL_FROM:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
  # false = o login não exige o e-mail verificado (instalação sem transporte).
  EXIGIR_EMAIL_VERIFICADO: ${EXIGIR_EMAIL_VERIFICADO:-true}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  # Endereços desta instalação (ver .env.example). Vazios = as convenções de
  # app/core/config.py, que partem do FRONTEND_URL.
  AGENTS_URL: ${AGENTS_URL:-}
  # Uma instalacao pode desligar as extensoes presentes sem apagar a pasta
  # (app/extensoes/__init__.py). Vazio = as extensoes do disco valem. So a API:
  # as do web entram no build (web/extensoes/instaladas.ts).
  ATLANS_SEM_EXTENSOES: ${ATLANS_SEM_EXTENSOES:-}
  # CA do Postgres (app/core/db.py, com ?ssl=verify-ca|verify-full no DATABASE_URL):
  # o caminho DENTRO do container; o arquivo precisa estar la (volume ou imagem).
  DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
  EXECUTOR_REPO_URL: ${EXECUTOR_REPO_URL:-}
  DESKTOP_RELEASES_REPO: ${DESKTOP_RELEASES_REPO:-}
  # Hosts aceitos pelo transporte do servidor MCP (app/mcp). Vazio (padrao) =
  # o host do FRONTEND_URL (com e sem porta) + localhost:* e 127.0.0.1:*; um
  # Host fora dela recebe 421. Ver docs/mcp.md.
  MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
  # Assistente — superfícies do editor (/assistente/editor) e da Home (/assistente). O modelo vem
  # de uma API compatível com a da OpenAI: o OpenRouter (padrão), um gateway ou
  # um servidor local. A chave e da PLATAFORMA (quem paga os tokens e a
  # instalacao, e o teto por pessoa vive no Redis). Vazia = o assistente nao existe
  # e o resto do editor continua inteiro. Ver docs/assistant.md.
  # LLM_* são os nomes genéricos; OPENROUTER_* continuam valendo.
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  # Vazio = a API publica (https://openrouter.ai/api/v1).
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
  # true = o nome e o FRONTEND_URL vão como atribuição do app no OpenRouter.
  ASSISTENTE_ATRIBUICAO: ${ASSISTENTE_ATRIBUICAO:-}
  ASSISTENTE_ATIVO: ${ASSISTENTE_ATIVO:-true}
  ASSISTENTE_MODELO: ${ASSISTENTE_MODELO:-}
  ASSISTENTE_IDIOMA: ${ASSISTENTE_IDIOMA:-}
  # Tokens por pessoa em 24 h. Vazio = 1500000.
  ASSISTENTE_TETO_DE_TOKENS_POR_DIA: ${ASSISTENTE_TETO_DE_TOKENS_POR_DIA:-}
  # Catalogo de fontes (docs/sources.md). FONTES_CATALOGO_DIR VAZIA desliga a
  # importacao, e fora do .env vale a pasta do repositorio: sem os dois-pontos
  # no `-`, de proposito, para o vazio chegar vazio.
  FONTES_CATALOGO_DIR: ${FONTES_CATALOGO_DIR-catalogo/geoservicos}
  FONTES_APRENDER_DAS_EXECUCOES: ${FONTES_APRENDER_DAS_EXECUCOES:-}
  FONTES_VERIFICACAO_INTERVAL: ${FONTES_VERIFICACAO_INTERVAL:-}
  # O fuso dos agendamentos que nao dizem o seu (flow/utils/fuso.py). Vazio = UTC.
  # Trocar numa instalacao com agendamentos recria, no proximo save, os que nao
  # tem fuso explicito (ver app/core/constants.py).
  AGENDAMENTO_FUSO_PADRAO: ${AGENDAMENTO_FUSO_PADRAO:-}
  EMAIL_VERIFY_TOKEN_TTL: ${EMAIL_VERIFY_TOKEN_TTL:-1440}
  PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-30}
  # Rede do Traefik: origem confiavel para X-Forwarded-Tls-Client-Cert-Info
  # (identidade mTLS do executor) e X-Forwarded-For (chave de rate limit).
  # Nao confundir com EDGE_PROXIES (Cloudflare, que ANEXA o cliente ao XFF):
  # nao e repassada aqui de proposito — o default da app ja e a lista da
  # Cloudflare. Ver .env.example e app/core/trusted_proxy.py.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
  # ── mTLS + step-ca + OTP de enrollment ───────────────────────────────────
  STEPCA_URL: ${STEPCA_URL:-https://step-ca:9000}
  STEPCA_PROVISIONER_NAME: ${STEPCA_PROVISIONER_NAME:-atlans-app}
  STEPCA_PROVISIONER_PASSWORD: ${STEPCA_PROVISIONER_PASSWORD:-}
  STEPCA_ROOT_FINGERPRINT: ${STEPCA_ROOT_FINGERPRINT:-}
  OTP_PEPPER: ${OTP_PEPPER:-}
  EXECUTOR_CERT_TTL_DAYS: ${EXECUTOR_CERT_TTL_DAYS:-90}
  EXECUTOR_OTP_TTL_HOURS: ${EXECUTOR_OTP_TTL_HOURS:-24}

x-api-volumes: &api-volumes
  - artifacts_data:/data/artifacts

# Driver de log da API e do web: LOG_DRIVER no .env (padrão json-file, que roda
# em qualquer host). O json-file apaga o log junto com o container, e o deploy
# recria api-prod e web-prod: em produção num host com systemd, `journald` mantém
# o log no host depois do deploy, com o teto de disco do próprio journald, e
# `docker compose logs` continua lendo (consulta direta: `journalctl -t <tag>`).
# Sem systemd-journald no host (Docker Desktop, por exemplo), journald não sobe.
x-log-persistente: &log-persistente
  driver: ${LOG_DRIVER:-json-file}

services:

  redis:
    # REDIS_IMAGE no .env. O padrao e o Valkey (BSD-3, compativel com o
    # protocolo e os comandos que o Atlans usa): o Redis 7.4+ saiu sob
    # RSALv2/SSPLv1, que nao sao licencas livres. O Valkey NAO le os dados
    # gravados pelo Redis 7.4 (RDB versao 12) e nao sobe sobre eles: uma
    # instalacao que ja roda o Redis fica nele (REDIS_IMAGE=redis:7-alpine) ou
    # troca comecando de um volume vazio.
    image: ${REDIS_IMAGE:-valkey/valkey:8-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1
      --save 300 10
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --protected-mode yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── DESENVOLVIMENTO ────────────────────────────────────────────────────────

  api:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --ws websockets --ws-ping-interval 60 --ws-ping-timeout 600 --ws-max-size 16777216
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      FERNET_KEY: ${FERNET_KEY}
      # Rotacao (opcional): "<nova>,<antiga>", ver app/core/config.py. Vazio = so a FERNET_KEY.
      FERNET_KEYS: ${FERNET_KEYS:-}
      EXECUTOR_SIGNING_KEY: ${EXECUTOR_SIGNING_KEY:-}
    # Um Postgres no proprio host e `host.docker.internal` no DATABASE_URL
    # (`localhost` dentro do container e o container); no Linux o nome so
    # existe com este extra_hosts, como no api-prod.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # SEG: bind apenas em loopback. Publicar em 0.0.0.0 expunha a API sem o
      # Traefik na frente — ou seja, sem o strip do header de cert mTLS, sem
      # rate limit e sem terminacao TLS.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    volumes:
      - .:/app
      - artifacts_data:/data/artifacts
    networks:
      - backend
      - dev-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web-dev:
    profiles: ["dev"]
    build:
      context: ./web
      dockerfile: Dockerfile.ui
      target: dev
      # A raiz do repositorio, para a LICENSE e o THIRD-PARTY-NOTICES.md irem na
      # imagem (BuildKit; Compose 2.17+).
      additional_contexts:
        raiz: .
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *mapa-env
      NODE_ENV: development
      TZ: ${TZ}
      AUTH_SECRET: ${AUTH_SECRET}
      API_INTERNA: ${API_INTERNA}
      NEXT_PUBLIC_API_PORT: ${API_PORT}
      CODIGO_FONTE_URL: ${CODIGO_FONTE_URL:-}
      # O nome que a tela mostra (barra lateral, entrada, aba). Vazio = Atlans.
      NOME_NA_TELA: ${NOME_NA_TELA:-}
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - backend
      - dev-net
  # ── PRODUCAO ───────────────────────────────────────────────────────────────

  # CA interna (step-ca) que emite e renova certs mTLS dos executores. Ela cria
  # a CA sozinha no primeiro boot (os DOCKER_STEPCA_INIT_* abaixo); depois, uma
  # vez, `make bootstrap-stepca` (docs/mtls-bootstrap.md): o fingerprint no
  # .env, o intermediate.crt em ./traefik/atlans-ca/ para o Traefik validar os
  # client certs, o prazo dos certificados e o cert do AGENTS_HOST.
  step-ca:
    image: smallstep/step-ca:0.27.0
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      DOCKER_STEPCA_INIT_NAME: "Atlans Internal CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "step-ca,localhost"
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: ${STEPCA_PROVISIONER_NAME:-atlans-app}
      DOCKER_STEPCA_INIT_PASSWORD_FILE: /run/secrets/stepca_password
    volumes:
      - step-ca-data:/home/step
    secrets:
      - stepca_password
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  traefik:
    image: traefik:v3.6
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Versão da API do Docker que o provider do Traefik usa. Vazio = negocia com
      # o engine do host (o certo para Docker atual: o 29 recusa clientes abaixo
      # da 1.44). Um engine antigo que não negocia pede o valor fixo (ex.: 1.41).
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Certificado do site (cert.pem/key.pem), de qualquer origem: o de origem da
      # Cloudflare, um do Let's Encrypt (certbot) ou outro. O caminho no
      # container mantém o nome antigo; ver traefik-dynamic/dynamic.yml.
      - ${SSL_CERT_DIR:-./certs}:/etc/ssl/cloudflare:ro
      # DIRETORIO, nunca o arquivo solto. Bind mount de arquivo unico prende o
      # INODE: quando uma atualizacao apaga o arquivo no host e escreve outro no
      # lugar, o container segue lendo o inode antigo — ja desvinculado — ate
      # ser recriado, e um middleware novo (o rate-mcp, por exemplo) fica
      # invisivel e derruba o router que o usa. Montando o diretorio, o caminho
      # e resolvido a cada leitura e a troca do arquivo aparece.
      #
      # Na RAIZ do projeto, e nao dentro de ./traefik/: ./traefik/ guarda o que
      # e da instalacao (a CA interna, fora do git), e ./traefik-dynamic/ vem do
      # repositorio. Quem atualiza o codigo nao precisa escrever na pasta da CA.
      # Ver docs/operations.md, "Configuracao dinamica do Traefik".
      - ./traefik-dynamic:/etc/traefik/dynamic:ro
      # Access log do Traefik no host (TRAEFIK_LOG_DIR; padrão ./logs/traefik).
      - ${TRAEFIK_LOG_DIR:-./logs/traefik}:/var/log/traefik
      # CA interna que assina certs dos executores — usada para validar client certs no mTLS.
      # O make bootstrap-stepca copia para ./traefik/atlans-ca/ o intermediate.crt e o cert do AGENTS_HOST.
      - ./traefik/atlans-ca:/etc/ssl/atlans-ca:ro
    command:
      # --- Providers ---
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy-net"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # `directory` casa com o bind mount de diretorio acima; `watch` faz o
      # Traefik reler sozinho quando o arquivo muda, para que uma mudanca de
      # configuracao dinamica pare de exigir recriar o container.
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"

      # --- Entrypoint HTTP (:80) — redireciona para HTTPS ---
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # De quem o Traefik aceita X-Forwarded-*: o CDN na frente do site, se houver
      # (BORDA_FAIXAS_CONFIAVEIS; com Cloudflare, as faixas dela — ver
      # .env.example). Sem CDN, só o loopback: o Traefik é a borda e reescreve o
      # X-Forwarded-For com o IP de quem conectou.
      - "--entrypoints.web.forwardedHeaders.trustedIPs=${BORDA_FAIXAS_CONFIAVEIS:-127.0.0.1/32}"

      # --- Entrypoint HTTPS (:443) ---
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=${BORDA_FAIXAS_CONFIAVEIS:-127.0.0.1/32}"

      # --- Entrypoint interno (healthcheck/ping) ---
      - "--entrypoints.traefik-internal.address=:8082"
      - "--ping=true"
      - "--ping.entrypoint=traefik-internal"

      # --- Sem telemetria: nem checagem de versão nova, nem uso anônimo ---
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"

      # --- Logs ---
      - "--log.level=INFO"
      - "--api=false"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"
      - "--accesslog.format=json"
      - "--accesslog.fields.defaultmode=keep"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--accesslog.fields.headers.names.Cf-Connecting-Ip=keep"
      - "--accesslog.fields.headers.names.Cf-Ipcountry=keep"
      - "--accesslog.fields.headers.names.Cf-Ray=keep"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.headers.names.Referer=keep"
      - "--accesslog.fields.headers.names.X-Forwarded-For=keep"
    healthcheck:
      # `traefik healthcheck --ping` em v3.6.11 ignora --ping.entrypoint e
      # tenta porta default 8080, falhando quando o ping esta em outra porta.
      # wget direto no entrypoint configurado e mais confiavel.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Limites conservadores — Traefik é leve, mas sem teto há risco de
    # noisy-neighbor consumir recursos do host em picos de tráfego.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - proxy-net

  api-prod:
    profiles: ["prod"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile.api
    # A imagem da API: ATLANS_API_IMAGE no .env (padrão `atlans-api:local`, a que
    # o `build:` acima, ou `docker build -f Dockerfile.api -t atlans-api:local .`,
    # gera). Um deploy com registry aponta a variável para a imagem de lá, e o
    # servidor puxa só as camadas que mudaram.
    image: ${ATLANS_API_IMAGE:-atlans-api:local}
    # A conexao com o Postgres e DIRETA — nao ha pgbouncer neste compose (ver a
    # nota em app/core/db.py). Cada worker abre seu proprio pool, entao o teto de
    # conexoes e `--workers` x (POOL_SIZE + MAX_OVERFLOW) = 4 x 13 = 52. Ao mexer
    # em `--workers`, confira `SHOW max_connections` no servidor: estourar o
    # limite nao deixa lento, devolve "sorry, too many clients already".
    #
    # `--ws websockets` fixo (e o que o `auto` escolhe hoje): o envio ao executor
    # conta com esta implementacao escrever o frame INTEIRO antes do drain — ver
    # `_Saida` em app/core/executor_connections.py. A
    # `websockets-sansio` e a `wsproto` esperam o socket ANTES de escrever, e um
    # prazo estourado ali seria um job dado por entregue sem ter saido.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --ws websockets --ws-ping-interval 60 --ws-ping-timeout 600 --ws-max-size 16777216
    depends_on:
      redis:
        condition: service_healthy
      step-ca:
        condition: service_healthy
    environment:
      <<: *api-env
      # O host dos executores que o Traefik roteia (AGENTS_HOST) e o que a API
      # anuncia na matricula e no install.sh: uma fonte so. AGENTS_URL no .env
      # ainda vence, para quem serve os executores por outro endereco.
      AGENTS_URL: ${AGENTS_URL:-https://${AGENTS_HOST:-agents.localhost}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      FERNET_KEY: ${FERNET_KEY}
      # Rotacao (opcional): "<nova>,<antiga>", ver app/core/config.py. Vazio = so a FERNET_KEY.
      FERNET_KEYS: ${FERNET_KEYS:-}
      EXECUTOR_SIGNING_KEY: ${EXECUTOR_SIGNING_KEY}
    volumes:
      - artifacts_data:/data/artifacts
      # Acesso read-only ao ca.json da step-ca para gerar OTTs assinados com a
      # chave privada do provisioner JWK (decifrada com STEPCA_PROVISIONER_PASSWORD).
      # Necessario para os endpoints /executores/enroll e /executores/renew-cert.
      - step-ca-data:/etc/step-ca:ro
    restart: unless-stopped
    logging:
      <<: *log-persistente
      options:
        tag: atlans-api
    networks:
      - proxy-net
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # 4 workers uvicorn + bibliotecas geo (geopandas, shapely) consomem
    # memória — 2GB cobre uso típico com folga; CPU teto evita stall do host.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"

      # ═══════════════════════════════════════════════════════════════════════
      #  PUBLIC_HOST — tráfego de humanos (UI + webhook + tiles publicos)
      #  Pode estar atras de um CDN. NUNCA aplicar mTLS aqui — um CDN termina
      #  TLS na borda e o cert do executor nao chegaria de qualquer forma.
      #  Cada router deste host leva o middleware de borda na frente
      #  (BORDA_MIDDLEWARE; ver traefik-dynamic/dynamic.yml). Atras da
      #  Cloudflare, `cloudflare-only`: sem ele o origin responde por fora dela
      #  para quem descobrir o IP — e o host dos executores, DNS-only, o publica.
      #  Sem CDN, `borda-aberta`.
      # ═══════════════════════════════════════════════════════════════════════

      # WebSocket de UI (workflow log streaming consumido pelo frontend)
      - "traefik.http.routers.api-ws-ui.rule=Host(`${PUBLIC_HOST:-localhost}`) && PathPrefix(`/ws/`)"
      - "traefik.http.routers.api-ws-ui.entrypoints=websecure"
      - "traefik.http.routers.api-ws-ui.tls=true"
      - "traefik.http.routers.api-ws-ui.priority=20"
      - "traefik.http.routers.api-ws-ui.service=api-svc"
      - "traefik.http.routers.api-ws-ui.middlewares=${BORDA_MIDDLEWARE:-borda-aberta}@file,strip-executor-cert-header@file"

      # REST publico (webhook receiver + tiles do portal + onboarding de executores)
      # Inclui /executores/ca-bundle e /executores/install no host publico porque o operador
      # novo (rodando install.sh) ainda nao tem o root cert da CA interna no trust
      # store — entao o host dos executores (cert step-ca) falha o curl. O host
      # publico tem cert valido publicamente.
      # /webhooks/<servico> (plural): os avisos de servicos de fora, como o de
      # uma extensao de pagamentos. Fica explicito ao lado do PathPrefix(`/webhook`)
      # do gatilho de workflow, sem depender de o Traefik casar o prefixo por
      # texto ou por segmento.
      - "traefik.http.routers.api-rest-public.rule=Host(`${PUBLIC_HOST:-localhost}`) && (PathPrefix(`/webhook`) || PathPrefix(`/webhooks/`) || PathPrefix(`/artifacts/tiles`) || Path(`/executores/ca-bundle`) || Path(`/executores/install`) || Path(`/executores/server-public-key`))"
      - "traefik.http.routers.api-rest-public.entrypoints=websecure"
      - "traefik.http.routers.api-rest-public.tls=true"
      - "traefik.http.routers.api-rest-public.priority=10"
      - "traefik.http.routers.api-rest-public.service=api-svc"
      - "traefik.http.routers.api-rest-public.middlewares=${BORDA_MIDDLEWARE:-borda-aberta}@file,strip-executor-cert-header@file"

      # Download publico de artefatos (rate-limited)
      - "traefik.http.routers.api-download.rule=Host(`${PUBLIC_HOST:-localhost}`) && PathRegexp(`^/artifacts/portal/.*/download$`)"
      - "traefik.http.routers.api-download.entrypoints=websecure"
      - "traefik.http.routers.api-download.tls=true"
      - "traefik.http.routers.api-download.priority=30"
      - "traefik.http.routers.api-download.service=api-svc"
      - "traefik.http.routers.api-download.middlewares=${BORDA_MIDDLEWARE:-borda-aberta}@file,strip-executor-cert-header@file,rate-download-${BORDA_MIDDLEWARE:-borda-aberta}@file"

      # Servidor MCP (/mcp) — tokens pessoais no header Authorization.
      # Prioridade 20 porque o catch-all web-prod (Host(`${PUBLIC_HOST:-localhost}`), prioridade 1)
      # entregaria /mcp ao Next.js. PathPrefix e nao Path porque as DUAS grafias
      # tem de chegar a API: ela registra /mcp e /mcp/ como rotas exatas para o
      # mesmo servidor, e com Path(`/mcp`) a variante com barra cairia no Next.js.
      # NUNCA mtls-executores aqui — o host passa pela Cloudflare, que termina o
      # TLS e nao repassa cert de cliente.
      - "traefik.http.routers.api-mcp.rule=Host(`${PUBLIC_HOST:-localhost}`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.api-mcp.entrypoints=websecure"
      - "traefik.http.routers.api-mcp.tls=true"
      - "traefik.http.routers.api-mcp.priority=20"
      - "traefik.http.routers.api-mcp.service=api-svc"
      - "traefik.http.routers.api-mcp.middlewares=${BORDA_MIDDLEWARE:-borda-aberta}@file,strip-executor-cert-header@file,rate-mcp-${BORDA_MIDDLEWARE:-borda-aberta}@file"

      # ═══════════════════════════════════════════════════════════════════════
      #  AGENTS_HOST — trafego dos executores (sem CDN: DNS-only, se houver um).
      #  Cert TLS emitido pela step-ca interna (mesma CA que assina os executores).
      #  TLS option mtls-executores aplicada uniformemente -> mTLS funciona.
      # ═══════════════════════════════════════════════════════════════════════

      # Enrollment (Bearer OTP — sem cert ainda, mas mtls-executores permite via
      # VerifyClientCertIfGiven; backend autentica pelo Authorization header).
      - "traefik.http.routers.executores-enroll.rule=Host(`${AGENTS_HOST:-agents.localhost}`) && (Path(`/executores/enroll`) || Path(`/executores/server-public-key`))"
      - "traefik.http.routers.executores-enroll.entrypoints=websecure"
      - "traefik.http.routers.executores-enroll.tls=true"
      - "traefik.http.routers.executores-enroll.tls.options=mtls-executores@file"
      - "traefik.http.routers.executores-enroll.priority=50"
      - "traefik.http.routers.executores-enroll.service=api-svc"
      # Sem pass-executor-cert (nao usa mTLS), mas o strip e obrigatorio: sem ele
      # o header forjado pelo cliente chegaria intacto ao backend.
      - "traefik.http.routers.executores-enroll.middlewares=strip-executor-cert-header@file"

      # WebSocket de executores (mTLS validado pelo backend)
      - "traefik.http.routers.executores-ws.rule=Host(`${AGENTS_HOST:-agents.localhost}`) && PathPrefix(`/ws/executores/`)"
      - "traefik.http.routers.executores-ws.entrypoints=websecure"
      - "traefik.http.routers.executores-ws.tls=true"
      - "traefik.http.routers.executores-ws.tls.options=mtls-executores@file"
      - "traefik.http.routers.executores-ws.priority=40"
      - "traefik.http.routers.executores-ws.service=api-svc"
      - "traefik.http.routers.executores-ws.middlewares=strip-executor-cert-header@file,pass-executor-cert@file"

      # REST de executores (drive, /executores, artifacts/portal) — mTLS exigido
      - "traefik.http.routers.executores-rest.rule=Host(`${AGENTS_HOST:-agents.localhost}`) && (PathPrefix(`/executores`) || PathPrefix(`/drive/executor-`) || PathPrefix(`/artifacts/portal`))"
      - "traefik.http.routers.executores-rest.entrypoints=websecure"
      - "traefik.http.routers.executores-rest.tls=true"
      - "traefik.http.routers.executores-rest.tls.options=mtls-executores@file"
      - "traefik.http.routers.executores-rest.priority=10"
      - "traefik.http.routers.executores-rest.service=api-svc"
      - "traefik.http.routers.executores-rest.middlewares=strip-executor-cert-header@file,pass-executor-cert@file"

      # /internal (send-email pelos flow nodes) — mTLS + rate limit
      - "traefik.http.routers.executores-internal.rule=Host(`${AGENTS_HOST:-agents.localhost}`) && PathPrefix(`/internal`)"
      - "traefik.http.routers.executores-internal.entrypoints=websecure"
      - "traefik.http.routers.executores-internal.tls=true"
      - "traefik.http.routers.executores-internal.tls.options=mtls-executores@file"
      - "traefik.http.routers.executores-internal.priority=30"
      - "traefik.http.routers.executores-internal.service=api-svc"
      - "traefik.http.routers.executores-internal.middlewares=strip-executor-cert-header@file,rate-internal@file,pass-executor-cert@file"

      - "traefik.http.services.api-svc.loadbalancer.server.port=8000"

  web-prod:
    profiles: ["prod"]
    build:
      context: ./web
      dockerfile: Dockerfile.ui
      target: runner
      # A raiz do repositorio, para a LICENSE e o THIRD-PARTY-NOTICES.md irem na
      # imagem (BuildKit; Compose 2.17+).
      additional_contexts:
        raiz: .
    # A imagem do web: ATLANS_WEB_IMAGE no .env (padrão `atlans-web:local`; ver
    # web/Dockerfile.ui).
    image: ${ATLANS_WEB_IMAGE:-atlans-web:local}
    depends_on:
      api-prod:
        condition: service_started
    environment:
      <<: *mapa-env
      NODE_ENV: production
      TZ: ${TZ}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      API_INTERNA: http://api-prod:${API_PORT}
      # O link para o codigo-fonte desta instalacao (AGPL, secao 13), na tela
      # de entrada e no menu da conta. Vazio = sem o link.
      CODIGO_FONTE_URL: ${CODIGO_FONTE_URL:-}
      # O nome que a tela mostra (barra lateral, entrada, aba). Vazio = Atlans.
      NOME_NA_TELA: ${NOME_NA_TELA:-}
    restart: unless-stopped
    logging:
      <<: *log-persistente
      options:
        tag: atlans-web
    # 512M não cobria: em 22/09 o kernel matou o next-server com 519 MB de RSS
    # (OOM do cgroup) e o site caiu até o Docker reiniciá-lo. 1G dá folga para
    # o runtime + cache de SSR sem reservar nada — limite não é reserva.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.web-prod.rule=Host(`${PUBLIC_HOST:-localhost}`)"
      - "traefik.http.routers.web-prod.entrypoints=websecure"
      - "traefik.http.routers.web-prod.tls=true"
      - "traefik.http.routers.web-prod.priority=1"
      - "traefik.http.routers.web-prod.middlewares=${BORDA_MIDDLEWARE:-borda-aberta}@file"
      - "traefik.http.services.web-prod.loadbalancer.server.port=3000"

  minio:
    profiles: ["prod", "dev"]
    # Pin de versão estável — `latest` quebra reprodutibilidade e pode trazer
    # breaking changes silenciosamente em deploys. Atualizar manualmente após
    # validar release notes.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env (make bootstrap)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env (make bootstrap)}
      # CORS das URLs pre-assinadas: a Home busca (fetch) o GeoJSON de uma
      # camada direto do S3 pelo navegador. Hoje funciona pelo default `*` do
      # MinIO; fixar aqui torna explicito de onde o fetch pode vir antes de a
      # Home depender disso. `*` mantem o comportamento atual.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Buffers de upload/download de artefatos podem crescer; 2GB cobre uso
    # típico de workflows com múltiplos arquivos médios em paralelo.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    networks:
      - proxy-net
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      # S3 API via S3_HOST (HTTPS/TLS via Traefik)
      - "traefik.http.routers.minio-s3.rule=Host(`${S3_HOST:-s3.localhost}`)"
      - "traefik.http.routers.minio-s3.entrypoints=websecure"
      - "traefik.http.routers.minio-s3.tls=true"
      - "traefik.http.routers.minio-s3.service=minio-s3-svc"
      - "traefik.http.routers.minio-s3.middlewares=${BORDA_MIDDLEWARE:-borda-aberta}@file"
      - "traefik.http.services.minio-s3-svc.loadbalancer.server.port=9000"
      # Console (porta 9001) não exposto publicamente — acesso via SSH tunnel:
      # ssh -L 9001:127.0.0.1:9001 servidor && open http://localhost:9001

networks:
  proxy-net:
    driver: bridge
    name: proxy-net   # nome fixo — sem prefixo do projeto (necessário para Traefik)
    # Subnet fixa: TRUSTED_PROXIES aponta para esta faixa (é dela que saem as
    # requisições do Traefik para a API, e é ela que autoriza o header de cert
    # mTLS). Sem fixar, uma recriação da rede pode receber outra faixa do
    # Docker e todos os executores passam a tomar 401.
    # Só tem efeito na criação da rede — em rede já existente o Docker ignora.
    # PROXY_NET_SUBNET troca a faixa (ver .env.example), dentro de TRUSTED_PROXIES.
    ipam:
      config:
        - subnet: ${PROXY_NET_SUBNET:-172.18.0.0/16}
  backend:
    driver: bridge
  dev-net:
    driver: bridge

volumes:
  redis_data:
  artifacts_data:
  minio_data:
  # step-ca-data contem a chave privada da CA interna que assina TODOS os certs
  # de executores. Marcado como external para sobreviver a `docker compose down -v`
  # acidental (que destrui volumes compose-managed). Bootstrap manual:
  #   docker volume create step-ca-data
  # Backup recomendado periodicamente:
  #   docker run --rm -v step-ca-data:/data -v $(pwd)/backups:/backup alpine \
  #       tar czf /backup/step-ca-$(date +%F).tar.gz -C /data .
  step-ca-data:
    external: true

secrets:
  stepca_password:
    file: ./secrets/stepca_password.txt

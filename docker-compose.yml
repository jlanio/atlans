name: Atlans App

# The installation's tile servers (web/lib/fundos-do-mapa.ts and
# app/core/config.py). Empty = only the OpenStreetMap streets, no satellite.
# They go to the API (which injects them into the Carta nodes) and to the web
# (the map and the globe).
x-mapa-env: &mapa-env
  MAPA_RUAS_URL: ${MAPA_RUAS_URL:-}
  MAPA_RUAS_CREDITO: ${MAPA_RUAS_CREDITO:-}
  MAPA_SATELITE_URL: ${MAPA_SATELITE_URL:-}
  MAPA_SATELITE_CREDITO: ${MAPA_SATELITE_CREDITO:-}
  MAPA_HIBRIDO_URL: ${MAPA_HIBRIDO_URL:-}
  MAPA_HIBRIDO_CREDITO: ${MAPA_HIBRIDO_CREDITO:-}

x-api-env: &api-env
  <<: *mapa-env
  TZ: ${TZ}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  # Per-IP rate limit counters (app/core/rate_limiter.py). Empty (default)
  # = the REDIS_URL above, and the limits apply to the whole API; `memory://`
  # goes back to each worker's memory (see docs/operations.md).
  RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-}
  # Deadline for each database command, in seconds (app/core/config.py). Empty =
  # 60 (Postgres cancels) and 90 (asyncpg gives up); 0 turns it off.
  DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-}
  DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT:-}
  # Routing by execution policy (docs/specs/executor-isolation-routing.md).
  # `off` (default): the API routes as always — targeted executor, then the
  # pool — and the policy editor is a preview. `on`: tiers, fallback and last
  # resort take effect. Rollback = go back to `off` and recreate the container.
  EXECUTOR_POLICY_ROUTING: ${EXECUTOR_POLICY_ROUTING:-off}
  APP_SECRET: ${APP_SECRET}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-http://localhost:9000}
  # Required, no default (`:?` so compose stops without them): MinIO is
  # published on S3_HOST, and a default would be a public password.
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env (make bootstrap)}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env (make bootstrap)}
  MINIO_BUCKET: ${MINIO_BUCKET:-atlans-drive}
  MINIO_PRESIGN_EXPIRY: ${MINIO_PRESIGN_EXPIRY:-3600}
  # Email (app/services/email_transporte.py): resend, smtp or log. Empty =
  # whatever is configured — Resend with the key, SMTP with the host, log
  # without them.
  EMAIL_BACKEND: ${EMAIL_BACKEND:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SEGURANCA: ${SMTP_SEGURANCA:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  # Empty = Atlans <noreply@FRONTEND_URL host> (app/core/config.py).
  # RESEND_FROM_EMAIL is the old name and still works.
  EMAIL_FROM: ${EMAIL_FROM:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
  # false = login does not require a verified email (installation without a transport).
  EXIGIR_EMAIL_VERIFICADO: ${EXIGIR_EMAIL_VERIFICADO:-true}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  # Addresses of this installation (see .env.example). Empty = the conventions
  # of app/core/config.py, which derive from FRONTEND_URL.
  AGENTS_URL: ${AGENTS_URL:-}
  # An installation can turn off the extensions present without deleting the
  # folder (app/extensoes/__init__.py). Empty = the extensions on disk apply.
  # API only: the web ones go into the build (web/extensoes/instaladas.ts).
  ATLANS_SEM_EXTENSOES: ${ATLANS_SEM_EXTENSOES:-}
  # Postgres CA (app/core/db.py, with ?ssl=verify-ca|verify-full in DATABASE_URL):
  # the path INSIDE the container; the file needs to be there (volume or image).
  DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
  EXECUTOR_REPO_URL: ${EXECUTOR_REPO_URL:-}
  DESKTOP_RELEASES_REPO: ${DESKTOP_RELEASES_REPO:-}
  # Hosts accepted by the MCP server transport (app/mcp). Empty (default) =
  # the FRONTEND_URL host (with and without port) + localhost:* and
  # 127.0.0.1:*; a Host outside that list gets 421. See docs/mcp.md.
  MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
  # Assistant — editor (/assistente/editor) and Home (/assistente) surfaces. The model comes
  # from an OpenAI-compatible API: OpenRouter (default), a gateway or a local
  # server. The key belongs to the PLATFORM (whoever pays for the tokens is the
  # installation, and the per-person ceiling lives in Redis). Empty = the
  # assistant does not exist and the rest of the editor remains intact. See
  # docs/assistant.md.
  # LLM_* are the generic names; OPENROUTER_* still work.
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  # Vazio = a API publica (https://openrouter.ai/api/v1).
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
  # true = the name and FRONTEND_URL are sent as the app attribution on OpenRouter.
  ASSISTENTE_ATRIBUICAO: ${ASSISTENTE_ATRIBUICAO:-}
  ASSISTENTE_ATIVO: ${ASSISTENTE_ATIVO:-true}
  ASSISTENTE_MODELO: ${ASSISTENTE_MODELO:-}
  ASSISTENTE_IDIOMA: ${ASSISTENTE_IDIOMA:-}
  # Tokens por pessoa em 24 h. Vazio = 1500000.
  ASSISTENTE_TETO_DE_TOKENS_POR_DIA: ${ASSISTENTE_TETO_DE_TOKENS_POR_DIA:-}
  # Source catalog (docs/sources.md). An EMPTY FONTES_CATALOGO_DIR turns off the
  # import, and outside .env the repository folder applies: no colon in the
  # `-`, on purpose, so that empty arrives empty.
  FONTES_CATALOGO_DIR: ${FONTES_CATALOGO_DIR-catalogo/geoservicos}
  FONTES_APRENDER_DAS_EXECUCOES: ${FONTES_APRENDER_DAS_EXECUCOES:-}
  FONTES_VERIFICACAO_INTERVAL: ${FONTES_VERIFICACAO_INTERVAL:-}
  # The time zone for schedules that do not state their own (flow/utils/fuso.py).
  # Empty = UTC. Changing it on an installation with schedules recreates, on the
  # next save, those without an explicit time zone (see app/core/constants.py).
  AGENDAMENTO_FUSO_PADRAO: ${AGENDAMENTO_FUSO_PADRAO:-}
  EMAIL_VERIFY_TOKEN_TTL: ${EMAIL_VERIFY_TOKEN_TTL:-1440}
  PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-30}
  # Traefik network: trusted origin for X-Forwarded-Tls-Client-Cert-Info
  # (executor mTLS identity) and X-Forwarded-For (rate limit key).
  # Not to be confused with EDGE_PROXIES (Cloudflare, which APPENDS the client
  # to XFF): it is not passed here on purpose — the app default is already the
  # Cloudflare list. See .env.example and app/core/trusted_proxy.py.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
  # ── mTLS + step-ca + OTP de enrollment ───────────────────────────────────
  STEPCA_URL: ${STEPCA_URL:-https://step-ca:9000}
  STEPCA_PROVISIONER_NAME: ${STEPCA_PROVISIONER_NAME:-atlans-app}
  STEPCA_PROVISIONER_PASSWORD: ${STEPCA_PROVISIONER_PASSWORD:-}
  STEPCA_ROOT_FINGERPRINT: ${STEPCA_ROOT_FINGERPRINT:-}
  OTP_PEPPER: ${OTP_PEPPER:-}
  EXECUTOR_CERT_TTL_DAYS: ${EXECUTOR_CERT_TTL_DAYS:-90}
  EXECUTOR_OTP_TTL_HOURS: ${EXECUTOR_OTP_TTL_HOURS:-24}

x-api-volumes: &api-volumes
  - artifacts_data:/data/artifacts

# Log driver for the API and the web: LOG_DRIVER in .env (default json-file,
# which runs on any host). json-file deletes the log along with the container,
# and the deploy recreates api-prod and web-prod: in production on a host with
# systemd, `journald` keeps the log on the host after the deploy, with
# journald's own disk ceiling, and `docker compose logs` keeps reading it
# (direct query: `journalctl -t <tag>`). Without systemd-journald on the host
# (Docker Desktop, for example), journald does not start.
x-log-persistente: &log-persistente
  driver: ${LOG_DRIVER:-json-file}

services:

  redis:
    # REDIS_IMAGE in .env. The default is Valkey (BSD-3, compatible with the
    # protocol and the commands Atlans uses): Redis 7.4+ was released under
    # RSALv2/SSPLv1, which are not free licenses. Valkey does NOT read the data
    # written by Redis 7.4 (RDB version 12) and does not start on top of it: an
    # installation already running Redis stays on it
    # (REDIS_IMAGE=redis:7-alpine) or switches starting from an empty volume.
    image: ${REDIS_IMAGE:-valkey/valkey:8-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1
      --save 300 10
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --protected-mode yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── DESENVOLVIMENTO ────────────────────────────────────────────────────────

  api:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --ws websockets --ws-ping-interval 60 --ws-ping-timeout 600 --ws-max-size 16777216
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      FERNET_KEY: ${FERNET_KEY}
      # Rotacao (opcional): "<nova>,<antiga>", ver app/core/config.py. Vazio = so a FERNET_KEY.
      FERNET_KEYS: ${FERNET_KEYS:-}
      EXECUTOR_SIGNING_KEY: ${EXECUTOR_SIGNING_KEY:-}
    # A Postgres on the host itself is `host.docker.internal` in DATABASE_URL
    # (`localhost` inside the container is the container); on Linux the name
    # only exists with this extra_hosts, as in api-prod.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # SEC: bind on loopback only. Publishing on 0.0.0.0 exposed the API without
      # Traefik in front — that is, without the mTLS cert header strip, without
      # rate limiting and without TLS termination.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    volumes:
      - .:/app
      - artifacts_data:/data/artifacts
    networks:
      - backend
      - dev-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web-dev:
    profiles: ["dev"]
    build:
      context: ./web
      dockerfile: Dockerfile.ui
      target: dev
      # The repository root, so LICENSE and THIRD-PARTY-NOTICES.md go into the
      # image (BuildKit; Compose 2.17+).
      additional_contexts:
        raiz: .
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *mapa-env
      NODE_ENV: development
      TZ: ${TZ}
      AUTH_SECRET: ${AUTH_SECRET}
      API_INTERNA: ${API_INTERNA}
      NEXT_PUBLIC_API_PORT: ${API_PORT}
      CODIGO_FONTE_URL: ${CODIGO_FONTE_URL:-}
      # O nome que a tela mostra (barra lateral, entrada, aba). Vazio = Atlans.
      NOME_NA_TELA: ${NOME_NA_TELA:-}
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - backend
      - dev-net
  # ── PRODUCAO ───────────────────────────────────────────────────────────────

  # Internal CA (step-ca) that issues and renews the executors' mTLS certs. It
  # creates the CA on its own on first boot (the DOCKER_STEPCA_INIT_* below);
  # then, once, `make bootstrap-stepca` (docs/mtls-bootstrap.md): the
  # fingerprint in .env, the intermediate.crt in ./traefik/atlans-ca/ for
  # Traefik to validate client certs, the certificate lifetime and the
  # AGENTS_HOST cert.
  step-ca:
    image: smallstep/step-ca:0.27.0
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      DOCKER_STEPCA_INIT_NAME: "Atlans Internal CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "step-ca,localhost"
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: ${STEPCA_PROVISIONER_NAME:-atlans-app}
      DOCKER_STEPCA_INIT_PASSWORD_FILE: /run/secrets/stepca_password
    volumes:
      - step-ca-data:/home/step
    secrets:
      - stepca_password
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  traefik:
    image: traefik:v3.6
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Docker API version used by the Traefik provider. Empty = negotiates with
      # the host engine (the right choice for current Docker: 29 rejects clients
      # below 1.44). An old engine that does not negotiate needs the fixed value
      # (e.g. 1.41).
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Site certificate (cert.pem/key.pem), from any source: Cloudflare's origin
      # cert, a Let's Encrypt one (certbot) or another. The path in the
      # container keeps the old name; see traefik-dynamic/dynamic.yml.
      - ${SSL_CERT_DIR:-./certs}:/etc/ssl/cloudflare:ro
      # The DIRECTORY, never the loose file. A single-file bind mount pins the
      # INODE: when an update deletes the file on the host and writes another
      # in its place, the container keeps reading the old inode — already
      # unlinked — until it is recreated, and a new middleware (rate-mcp, for
      # example) stays invisible and brings down the router that uses it.
      # Mounting the directory, the path is resolved on every read and the file
      # swap shows up.
      #
      # At the project ROOT, not inside ./traefik/: ./traefik/ holds what
      # belongs to the installation (the internal CA, outside git), and
      # ./traefik-dynamic/ comes from the repository. Whoever updates the code
      # does not need to write to the CA folder.
      # See docs/operations.md, "Traefik dynamic configuration".
      - ./traefik-dynamic:/etc/traefik/dynamic:ro
      # Traefik access log on the host (TRAEFIK_LOG_DIR; default ./logs/traefik).
      - ${TRAEFIK_LOG_DIR:-./logs/traefik}:/var/log/traefik
      # Internal CA that signs the executors' certs — used to validate client certs in mTLS.
      # make bootstrap-stepca copies the intermediate.crt and the AGENTS_HOST cert to ./traefik/atlans-ca/.
      - ./traefik/atlans-ca:/etc/ssl/atlans-ca:ro
    command:
      # --- Providers ---
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy-net"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # `directory` matches the directory bind mount above; `watch` makes
      # Traefik reload on its own when the file changes, so that a dynamic
      # configuration change no longer requires recreating the container.
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"

      # --- HTTP entrypoint (:80) — redirects to HTTPS ---
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Whom Traefik accepts X-Forwarded-* from: the CDN in front of the site, if
      # any (BORDA_FAIXAS_CONFIAVEIS; with Cloudflare, its ranges — see
      # .env.example). Without a CDN, only loopback: Traefik is the edge and
      # rewrites X-Forwarded-For with the IP of whoever connected.
      - "--entrypoints.web.forwardedHeaders.trustedIPs=${BORDA_FAIXAS_CONFIAVEIS:-127.0.0.1/32}"

      # --- Entrypoint HTTPS (:443) ---
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=${BORDA_FAIXAS_CONFIAVEIS:-127.0.0.1/32}"

      # --- Entrypoint interno (healthcheck/ping) ---
      - "--entrypoints.traefik-internal.address=:8082"
      - "--ping=true"
      - "--ping.entrypoint=traefik-internal"

      # --- No telemetry: neither new-version checks nor anonymous usage ---
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"

      # --- Logs ---
      - "--log.level=INFO"
      - "--api=false"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"
      - "--accesslog.format=json"
      - "--accesslog.fields.defaultmode=keep"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--accesslog.fields.headers.names.Cf-Connecting-Ip=keep"
      - "--accesslog.fields.headers.names.Cf-Ipcountry=keep"
      - "--accesslog.fields.headers.names.Cf-Ray=keep"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.headers.names.Referer=keep"
      - "--accesslog.fields.headers.names.X-Forwarded-For=keep"
    healthcheck:
      # `traefik healthcheck --ping` in v3.6.11 ignores --ping.entrypoint and
      # tries the default port 8080, failing when ping is on another port.
      # A direct wget on the configured entrypoint is more reliable.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Conservative limits — Traefik is light, but without a ceiling there is a
    # risk of a noisy neighbor consuming host resources during traffic spikes.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - proxy-net

  api-prod:
    profiles: ["prod"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile.api
    # The API image: ATLANS_API_IMAGE in .env (default `atlans-api:local`, the one
    # that the `build:` above, or `docker build -f Dockerfile.api -t atlans-api:local .`,
    # produces). A deploy with a registry points the variable at the image
    # there, and the server pulls only the layers that changed.
    image: ${ATLANS_API_IMAGE:-atlans-api:local}
    # The connection to Postgres is DIRECT — there is no pgbouncer in this compose
    # (see the note in app/core/db.py). Each worker opens its own pool, so the
    # connection ceiling is `--workers` x (POOL_SIZE + MAX_OVERFLOW) = 4 x 13 =
    # 52. When changing `--workers`, check `SHOW max_connections` on the
    # server: exceeding the limit does not slow things down, it returns
    # "sorry, too many clients already".
    #
    # `--ws websockets` pinned (it is what `auto` picks today): sending to the
    # executor relies on this implementation writing the WHOLE frame before the
    # drain — see `_Saida` in app/core/executor_connections.py.
    # `websockets-sansio` and `wsproto` wait for the socket BEFORE writing, and
    # a deadline exceeded there would be a job considered delivered without
    # having gone out.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --ws websockets --ws-ping-interval 60 --ws-ping-timeout 600 --ws-max-size 16777216
    depends_on:
      redis:
        condition: service_healthy
      step-ca:
        condition: service_healthy
    environment:
      <<: *api-env
      # The executors host that Traefik routes (AGENTS_HOST) is what the API
      # announces at enrollment and in install.sh: a single source. AGENTS_URL
      # in .env still wins, for those who serve the executors at another address.
      AGENTS_URL: ${AGENTS_URL:-https://${AGENTS_HOST:-agents.localhost}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      FERNET_KEY: ${FERNET_KEY}
      # Rotacao (opcional): "<nova>,<antiga>", ver app/core/config.py. Vazio = so a FERNET_KEY.
      FERNET_KEYS: ${FERNET_KEYS:-}
      EXECUTOR_SIGNING_KEY: ${EXECUTOR_SIGNING_KEY}
    volumes:
      - artifacts_data:/data/artifacts
      # Read-only access to step-ca's ca.json to generate OTTs signed with the
      # JWK provisioner's private key (decrypted with STEPCA_PROVISIONER_PASSWORD).
      # Required for the /executores/enroll and /executores/renew-cert endpoints.
      - step-ca-data:/etc/step-ca:ro
    restart: unless-stopped
    logging:
      <<: *log-persistente
      options:
        tag: atlans-api
    networks:
      - proxy-net
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # 4 uvicorn workers + geo libraries (geopandas, shapely) consume memory —
    # 2GB covers typical usage with room to spare; a CPU ceiling avoids host stalls.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"

      # ═══════════════════════════════════════════════════════════════════════
      #  PUBLIC_HOST — human traffic (UI + webhook + public tiles)
      #  May be behind a CDN. NEVER apply mTLS here — a CDN terminates TLS at
      #  the edge and the executor's cert would not arrive anyway.
      #  Each router on this host has the edge middleware in front
      #  (BORDA_MIDDLEWARE; see traefik-dynamic/dynamic.yml). Behind
      #  Cloudflare, `cloudflare-only`: without it the origin answers outside
      #  Cloudflare to anyone who discovers the IP — and the executors host,
      #  DNS-only, publishes it. Without a CDN, `borda-aberta`.
      # ═══════════════════════════════════════════════════════════════════════

      # UI WebSocket (workflow log streaming consumed by the frontend)
      - "traefik.http.routers.api-ws-ui.rule=Host(`${PUBLIC_HOST:-localhost}`) && PathPrefix(`/ws/`)"
      - "traefik.http.routers.api-ws-ui.entrypoints=websecure"
      - "traefik.http.routers.api-ws-ui.tls=true"
      - "traefik.http.routers.api-ws-ui.priority=20"
      - "traefik.http.routers.api-ws-ui.service=api-svc"
      - "traefik.http.routers.api-ws-ui.middlewares=${BORDA_MIDDLEWARE:-borda-aberta}@file,strip-executor-cert-header@file"

      # Public REST (webhook receiver + portal tiles + executor onboarding)
      # Includes /executores/ca-bundle and /executores/install on the public host because a
      # new operator (running install.sh) does not yet have the internal CA root cert in
      # the trust store — so the executors host (step-ca cert) fails the curl. The
      # public host has a publicly valid cert.
      # /webhooks/<servico> (plural): notifications from outside services, such
      # as a payments extension's. It is explicit next to the workflow
      # trigger's PathPrefix(`/webhook`), without depending on whether Traefik
      # matches the prefix by text or by segment.
      - "traefik.http.routers.api-rest-public.rule=Host(`${PUBLIC_HOST:-localhost}`) && (PathPrefix(`/webhook`) || PathPrefix(`/webhooks/`) || PathPrefix(`/artifacts/tiles`) || Path(`/executores/ca-bundle`) || Path(`/executores/install`) || Path(`/executores/server-public-key`))"
      - "traefik.http.routers.api-rest-public.entrypoints=websecure"
      - "traefik.http.routers.api-rest-public.tls=true"
      - "traefik.http.routers.api-rest-public.priority=10"
      - "traefik.http.routers.api-rest-public.service=api-svc"
      - "traefik.http.routers.api-rest-public.middlewares=${BORDA_MIDDLEWARE:-borda-aberta}@file,strip-executor-cert-header@file"

      # Download publico de artefatos (rate-limited)
      - "traefik.http.routers.api-download.rule=Host(`${PUBLIC_HOST:-localhost}`) && PathRegexp(`^/artifacts/portal/.*/download$`)"
      - "traefik.http.routers.api-download.entrypoints=websecure"
      - "traefik.http.routers.api-download.tls=true"
      - "traefik.http.routers.api-download.priority=30"
      - "traefik.http.routers.api-download.service=api-svc"
      - "traefik.http.routers.api-download.middlewares=${BORDA_MIDDLEWARE:-borda-aberta}@file,strip-executor-cert-header@file,rate-download-${BORDA_MIDDLEWARE:-borda-aberta}@file"

      # MCP server (/mcp) — personal tokens in the Authorization header.
      # Priority 20 because the web-prod catch-all (Host(`${PUBLIC_HOST:-localhost}`), priority 1)
      # would hand /mcp to Next.js. PathPrefix and not Path because BOTH
      # spellings have to reach the API: it registers /mcp and /mcp/ as exact
      # routes for the same server, and with Path(`/mcp`) the trailing-slash
      # variant would fall to Next.js.
      # NEVER mtls-executores here — the host goes through Cloudflare, which
      # terminates TLS and does not forward the client cert.
      - "traefik.http.routers.api-mcp.rule=Host(`${PUBLIC_HOST:-localhost}`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.api-mcp.entrypoints=websecure"
      - "traefik.http.routers.api-mcp.tls=true"
      - "traefik.http.routers.api-mcp.priority=20"
      - "traefik.http.routers.api-mcp.service=api-svc"
      - "traefik.http.routers.api-mcp.middlewares=${BORDA_MIDDLEWARE:-borda-aberta}@file,strip-executor-cert-header@file,rate-mcp-${BORDA_MIDDLEWARE:-borda-aberta}@file"

      # ═══════════════════════════════════════════════════════════════════════
      #  AGENTS_HOST — executor traffic (no CDN: DNS-only, if there is one).
      #  TLS cert issued by the internal step-ca (same CA that signs executors).
      #  TLS option mtls-executores applied uniformly -> mTLS works.
      # ═══════════════════════════════════════════════════════════════════════

      # Enrollment (Bearer OTP — no cert yet, but mtls-executores allows it via
      # VerifyClientCertIfGiven; the backend authenticates by the Authorization header).
      - "traefik.http.routers.executores-enroll.rule=Host(`${AGENTS_HOST:-agents.localhost}`) && (Path(`/executores/enroll`) || Path(`/executores/server-public-key`))"
      - "traefik.http.routers.executores-enroll.entrypoints=websecure"
      - "traefik.http.routers.executores-enroll.tls=true"
      - "traefik.http.routers.executores-enroll.tls.options=mtls-executores@file"
      - "traefik.http.routers.executores-enroll.priority=50"
      - "traefik.http.routers.executores-enroll.service=api-svc"
      # No pass-executor-cert (does not use mTLS), but the strip is mandatory:
      # without it the header forged by the client would reach the backend intact.
      - "traefik.http.routers.executores-enroll.middlewares=strip-executor-cert-header@file"

      # Executor WebSocket (mTLS validated by the backend)
      - "traefik.http.routers.executores-ws.rule=Host(`${AGENTS_HOST:-agents.localhost}`) && PathPrefix(`/ws/executores/`)"
      - "traefik.http.routers.executores-ws.entrypoints=websecure"
      - "traefik.http.routers.executores-ws.tls=true"
      - "traefik.http.routers.executores-ws.tls.options=mtls-executores@file"
      - "traefik.http.routers.executores-ws.priority=40"
      - "traefik.http.routers.executores-ws.service=api-svc"
      - "traefik.http.routers.executores-ws.middlewares=strip-executor-cert-header@file,pass-executor-cert@file"

      # REST de executores (drive, /executores, artifacts/portal) — mTLS exigido
      - "traefik.http.routers.executores-rest.rule=Host(`${AGENTS_HOST:-agents.localhost}`) && (PathPrefix(`/executores`) || PathPrefix(`/drive/executor-`) || PathPrefix(`/artifacts/portal`))"
      - "traefik.http.routers.executores-rest.entrypoints=websecure"
      - "traefik.http.routers.executores-rest.tls=true"
      - "traefik.http.routers.executores-rest.tls.options=mtls-executores@file"
      - "traefik.http.routers.executores-rest.priority=10"
      - "traefik.http.routers.executores-rest.service=api-svc"
      - "traefik.http.routers.executores-rest.middlewares=strip-executor-cert-header@file,pass-executor-cert@file"

      # /internal (send-email pelos flow nodes) — mTLS + rate limit
      - "traefik.http.routers.executores-internal.rule=Host(`${AGENTS_HOST:-agents.localhost}`) && PathPrefix(`/internal`)"
      - "traefik.http.routers.executores-internal.entrypoints=websecure"
      - "traefik.http.routers.executores-internal.tls=true"
      - "traefik.http.routers.executores-internal.tls.options=mtls-executores@file"
      - "traefik.http.routers.executores-internal.priority=30"
      - "traefik.http.routers.executores-internal.service=api-svc"
      - "traefik.http.routers.executores-internal.middlewares=strip-executor-cert-header@file,rate-internal@file,pass-executor-cert@file"

      - "traefik.http.services.api-svc.loadbalancer.server.port=8000"

  web-prod:
    profiles: ["prod"]
    build:
      context: ./web
      dockerfile: Dockerfile.ui
      target: runner
      # The repository root, so LICENSE and THIRD-PARTY-NOTICES.md go into the
      # image (BuildKit; Compose 2.17+).
      additional_contexts:
        raiz: .
    # The web image: ATLANS_WEB_IMAGE in .env (default `atlans-web:local`; see
    # web/Dockerfile.ui).
    image: ${ATLANS_WEB_IMAGE:-atlans-web:local}
    depends_on:
      api-prod:
        condition: service_started
    environment:
      <<: *mapa-env
      NODE_ENV: production
      TZ: ${TZ}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      API_INTERNA: http://api-prod:${API_PORT}
      # The link to this installation's source code (AGPL, section 13), on the
      # sign-in screen and in the account menu. Empty = no link.
      CODIGO_FONTE_URL: ${CODIGO_FONTE_URL:-}
      # O nome que a tela mostra (barra lateral, entrada, aba). Vazio = Atlans.
      NOME_NA_TELA: ${NOME_NA_TELA:-}
    restart: unless-stopped
    logging:
      <<: *log-persistente
      options:
        tag: atlans-web
    # 512M was not enough: on September 22 the kernel killed next-server at
    # 519 MB of RSS (cgroup OOM) and the site went down until Docker restarted
    # it. 1G leaves room for the runtime + SSR cache without reserving anything
    # — a limit is not a reservation.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.web-prod.rule=Host(`${PUBLIC_HOST:-localhost}`)"
      - "traefik.http.routers.web-prod.entrypoints=websecure"
      - "traefik.http.routers.web-prod.tls=true"
      - "traefik.http.routers.web-prod.priority=1"
      - "traefik.http.routers.web-prod.middlewares=${BORDA_MIDDLEWARE:-borda-aberta}@file"
      - "traefik.http.services.web-prod.loadbalancer.server.port=3000"

  minio:
    profiles: ["prod", "dev"]
    # Stable version pin — `latest` breaks reproducibility and can silently bring
    # breaking changes into deploys. Update manually after reviewing the
    # release notes.
    # MinIO, Inc. deleted minio/minio from Docker Hub (Sep 2026) after archiving
    # the community edition. pgsty/minio (Silo) is a maintained fork with the
    # same command and bundled `mc`, a drop-in replacement that reads existing
    # data. MINIO_IMAGE in .env overrides it.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env (make bootstrap)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env (make bootstrap)}
      # CORS for the presigned URLs: the Home fetches a layer's GeoJSON directly
      # from S3 in the browser. Today it works through MinIO's default `*`;
      # pinning it here makes explicit where the fetch may come from before
      # the Home depends on it. `*` keeps the current behavior.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Artifact upload/download buffers can grow; 2GB covers the typical usage
    # of workflows with multiple medium-sized files in parallel.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    networks:
      - proxy-net
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      # S3 API via S3_HOST (HTTPS/TLS via Traefik)
      - "traefik.http.routers.minio-s3.rule=Host(`${S3_HOST:-s3.localhost}`)"
      - "traefik.http.routers.minio-s3.entrypoints=websecure"
      - "traefik.http.routers.minio-s3.tls=true"
      - "traefik.http.routers.minio-s3.service=minio-s3-svc"
      - "traefik.http.routers.minio-s3.middlewares=${BORDA_MIDDLEWARE:-borda-aberta}@file"
      - "traefik.http.services.minio-s3-svc.loadbalancer.server.port=9000"
      # Console (port 9001) not publicly exposed — access via SSH tunnel:
      # ssh -L 9001:127.0.0.1:9001 servidor && open http://localhost:9001

networks:
  proxy-net:
    driver: bridge
    name: proxy-net   # nome fixo — sem prefixo do projeto (necessário para Traefik)
    # Fixed subnet: TRUSTED_PROXIES points to this range (it is where Traefik's
    # requests to the API come from, and it is what authorizes the mTLS cert
    # header). Without pinning it, a network recreation may get another range
    # from Docker and all executors start getting 401.
    # Only takes effect when the network is created — on an existing network
    # Docker ignores it.
    # PROXY_NET_SUBNET changes the range (see .env.example), within TRUSTED_PROXIES.
    ipam:
      config:
        - subnet: ${PROXY_NET_SUBNET:-172.18.0.0/16}
  backend:
    driver: bridge
  dev-net:
    driver: bridge

volumes:
  redis_data:
  artifacts_data:
  minio_data:
  # step-ca-data contains the private key of the internal CA that signs ALL the
  # executors' certs. Marked as external to survive an accidental
  # `docker compose down -v` (which destroys compose-managed volumes). Manual
  # bootstrap:
  #   docker volume create step-ca-data
  # Periodic backup recommended:
  #   docker run --rm -v step-ca-data:/data -v $(pwd)/backups:/backup alpine \
  #       tar czf /backup/step-ca-$(date +%F).tar.gz -C /data .
  step-ca-data:
    external: true

secrets:
  stepca_password:
    file: ./secrets/stepca_password.txt

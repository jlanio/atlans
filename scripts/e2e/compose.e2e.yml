# scripts/e2e/compose.e2e.yml
# The E2E stack: docker-compose.yml with web-dev served by the PRODUCTION
# build (the `runner` stage of web/Dockerfile.ui: `next build`, then the
# standalone server) instead of `next dev`. On-demand compilation in the dev
# server is the main source of intermittent timeouts in browser tests.
#
# Same service name on purpose: up.sh brings it up with the rest of the dev
# profile, smoke.sh checks it, and `docker compose logs` includes it, with
# nothing in those scripts changed. Used through COMPOSE_FILE, set by
# scripts/e2e/subir.sh and descer.sh. Paths are relative to the first file,
# docker-compose.yml. `!reset` needs Docker Compose 2.24.4 or later.

services:
  web-dev:
    build:
      target: runner
      args:
        # The browser reaches the API (and its WebSocket) on its own port, as
        # in dev; NEXT_PUBLIC_* is inlined at build time (utils/env.ts).
        NEXT_PUBLIC_API_PORT: ${API_PORT:-8000}
    image: atlans-web:e2e
    environment:
      NODE_ENV: production
      # No AUTH_URL, as in web-dev: NextAuth takes the host of the request,
      # which in production it only does when told to.
      AUTH_TRUST_HOST: "true"
    # The image carries the build; the dev bind mount would hide it.
    volumes: !reset []

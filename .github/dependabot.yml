# .github/dependabot.yml
#
# Dependency update PRs, which go through the same CI as any other change.
# Complements the "Auditoria de dependências" (dependency audit) job in ci.yml:
# that one shows what has a known vulnerability; this one brings the new version.
#
# Conservative policy, because of supply-chain attacks (a hijacked maintainer
# account publishing a malicious version, a worm spreading through the install
# script). Updating as soon as a new version comes out is exactly what those
# attacks exploit, so:
#
#   - New versions only ONCE A MONTH (the 1st), in one batch per ecosystem:
#     fewer entry points, each one reviewed calmly.
#   - `cooldown`: a version is only proposed after it has been published for 14
#     days; a major version, 30. A malicious version is usually discovered and
#     pulled within hours or a few days, and the quarantine lets that happen first.
#   - SECURITY fixes wait for neither the month nor the quarantine: they come via
#     "Dependabot security updates" (Settings → Code security), which do not follow
#     this file. There the flaw is already public, and waiting costs more.
#
# Every PR from here is reviewed before merge (checklist in CONTRIBUTING.md,
# "Dependabot PRs"). Opening the PR exposes nothing: Dependabot's PR CI runs with
# a read-only token and without the repository's secrets.
#
# Left out on purpose: the Dockerfiles' base images. The Python version moves
# together in four places (Dockerfile.api, Dockerfile.executor, the CI's
# setup-python and desktop/python-runtime.json) and the Node one also has a
# twin in CI — a PR that changed only the image tag would break that coupling.
version: 2
updates:
  # Python. `directory: "/"` already reaches first-level subfolders. The
  # `.in` -> `.txt` pairs (requirements, requirements-dev, executor/
  # requirements-full and executor/requirements) are pip-compile locks with
  # hashes, and Dependabot regenerates them on its own: it finds each `.in`'s
  # lock via the header's `--output-file` and infers the options from the
  # content (the hashed lines). It bumps what is in the `.in` files, and
  # transitive ones only for security; `scripts/travar_python.py --renovar`
  # keeps the others current. The same version goes up in every lock in the
  # same PR, and CI checks it (tests/unit/test_locks_python.py, and the
  # Desktop job installs the executor lock on Windows). The quarantine applies
  # to the updated package: the transitive ones pip-compile pulls along come
  # at that day's version, and CI's audit job lists those under 14 days old.
  #
  # Minor versions and fixes come in one PR per month (coupled packages, such
  # as boto3 + botocore + s3transfer, go up together). numpy, pandas and pyproj
  # come alone: they are pinned at the production version since the switch to
  # Python 3.12, and bumping each one is a migration. The jump to pandas 3.x is
  # left out: it changes node behavior (copy-on-write and the new string dtype).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: America/Cuiaba
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: pandas
        update-types: ["version-update:semver-major"]
    groups:
      python-menores:
        patterns: ["*"]
        exclude-patterns: ["numpy", "pandas", "pyproj"]
        update-types: [minor, patch]

  # Minor versions and fixes in one PR per month; a major version (Next, React,
  # MapLibre...) comes alone, because it usually requires code changes.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: America/Cuiaba
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The TypeScript and ESLint ceiling is that of the lint shipped with
      # eslint-config-next 16 (measured on 16.3.3). npm installs the new versions
      # on top, with only a peer warning; what breaks is `npm run lint`:
      #   - TypeScript 7: `next build` passes, but typescript-eslint 8
      #     refuses ("does not support TS 7.0"; accepts below 6.1);
      #   - ESLint 10: eslint-plugin-react 7.37 crashes ("getFilename is not a
      #     function").
      # TypeScript 6.0 is within the ceiling: it arrives as a major version, and CI
      # decides. The ceilings go up when a new eslint-config-next accepts the versions.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      - dependency-name: eslint
        versions: [">=10.0.0"]
    groups:
      # eslint-config-next has to track the Next version: separately, the
      # PR for either one breaks `npm ci` or the lint. The first matching group
      # takes the package, so this one comes before the minor-versions one.
      next:
        patterns: ["next", "eslint-config-next"]
      web-menores:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: America/Cuiaba
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # vite and @vitejs/plugin-react only install together when the major
      # version changes (the plugin declares which vite it accepts): separately,
      # each PR stops at ERESOLVE in `npm ci` (#235 and #216).
      vite:
        patterns: ["vite", "@vitejs/*"]
      desktop-menores:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: America/Cuiaba
    # 30 days for everything: Dependabot does not accept `semver-*-days` for actions
    # (it rejects the whole file), and the major version must wait the 30.
    cooldown:
      default-days: 30
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

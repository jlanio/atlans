# .github/dependabot.yml
#
# PRs de atualização de dependências, que passam pelo mesmo CI de qualquer
# mudança. Complementa o job "Auditoria de dependências" do ci.yml: lá aparece o
# que tem vulnerabilidade conhecida; aqui chega a versão nova.
#
# Política conservadora, por causa dos ataques à cadeia de suprimentos (conta de
# mantenedor sequestrada publicando versão maliciosa, worm que se espalha pelo
# script de instalação). Atualizar assim que sai versão nova é justamente o que
# esses ataques exploram, então:
#
#   - Versão nova só UMA VEZ POR MÊS (dia 1º), num lote por ecossistema:
#     menos portas de entrada, cada uma revisada com calma.
#   - `cooldown`: uma versão só é proposta depois de 14 dias publicada; versão
#     maior, 30. Versão maliciosa costuma ser descoberta e retirada em horas ou
#     poucos dias, e a quarentena deixa a descoberta acontecer antes.
#   - Correção de SEGURANÇA não espera nem o mês nem a quarentena: vem pelas
#     "Dependabot security updates" (Settings → Code security), que não seguem
#     este arquivo. Ali a falha já é pública, e esperar custa mais.
#
# Todo PR daqui é revisado antes do merge (roteiro em CONTRIBUTING.md, "PRs do
# Dependabot"). Abrir o PR não expõe nada: o CI de PR do Dependabot roda com
# token só de leitura e sem os segredos do repositório.
#
# Fora daqui de propósito: as imagens base dos Dockerfiles. A versão do Python
# anda junto em quatro lugares (Dockerfile.api, Dockerfile.executor, o
# setup-python do CI e desktop/python-runtime.json) e a do Node também tem par
# no CI — um PR que trocasse só a tag da imagem quebraria essa amarração.
version: 2
updates:
  # Python. `directory: "/"` já alcança as subpastas de primeiro nível. Os
  # pares `.in` -> `.txt` (requirements, requirements-dev, executor/
  # requirements-full e executor/requirements) são locks do pip-compile com
  # hash, e o Dependabot os regenera sozinho: acha o lock de cada `.in` pelo
  # `--output-file` do cabeçalho e deduz as opções do conteúdo (as linhas com
  # hash). Ele sobe o que está nos `.in`, e as transitivas só por segurança; as
  # outras o `scripts/travar_python.py --renovar` traz em dia. A mesma versão
  # sobe em todos os locks no mesmo PR, e o CI confere
  # (tests/unit/test_locks_python.py, e o job Desktop instala o lock do
  # executor no Windows). A quarentena vale para o pacote atualizado: as
  # transitivas que o pip-compile traz junto vêm na versão do dia, e o job de
  # auditoria do CI lista as que têm menos de 14 dias.
  #
  # Menores e correções vêm num PR por mês (pacotes acoplados, como boto3 +
  # botocore + s3transfer, sobem juntos). numpy, pandas e pyproj vêm sozinhos:
  # estão pinados na versão de produção desde a troca para o Python 3.12, e
  # subir cada um é migração. O salto do pandas para a 3.x fica de fora: muda
  # o comportamento dos nós (copy-on-write e o dtype de string novo).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: America/Cuiaba
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: pandas
        update-types: ["version-update:semver-major"]
    groups:
      python-menores:
        patterns: ["*"]
        exclude-patterns: ["numpy", "pandas", "pyproj"]
        update-types: [minor, patch]

  # Menores e correções num PR por mês; versão maior (Next, React,
  # MapLibre...) vem sozinha, porque costuma pedir mudança de código.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: America/Cuiaba
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # O teto do TypeScript e do ESLint é o do lint que vem com o
      # eslint-config-next 16 (medido no 16.3.3). O npm instala as versões novas
      # por cima, só com aviso de peer; quem quebra é o `npm run lint`:
      #   - TypeScript 7: o `next build` passa, mas o typescript-eslint 8
      #     recusa ("does not support TS 7.0"; aceita abaixo do 6.1);
      #   - ESLint 10: o eslint-plugin-react 7.37 cai ("getFilename is not a
      #     function").
      # O TypeScript 6.0 fica dentro do teto: chega como versão maior, e o CI
      # decide. Os tetos sobem quando um eslint-config-next novo aceitar as versões.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      - dependency-name: eslint
        versions: [">=10.0.0"]
    groups:
      # O eslint-config-next tem de acompanhar a versão do Next: separados, o
      # PR de um deles quebra o `npm ci` ou o lint. O primeiro grupo que casa
      # leva o pacote, então este vem antes do de menores.
      next:
        patterns: ["next", "eslint-config-next"]
      web-menores:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: America/Cuiaba
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # O vite e o @vitejs/plugin-react só instalam juntos quando muda a versão
      # maior (o plugin declara o vite que aceita): separados, cada PR para em
      # ERESOLVE no `npm ci` (#235 e #216).
      vite:
        patterns: ["vite", "@vitejs/*"]
      desktop-menores:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: America/Cuiaba
    # 30 dias para tudo: o Dependabot não aceita `semver-*-days` para actions
    # (recusa o arquivo inteiro), e a versão maior tem de esperar os 30.
    cooldown:
      default-days: 30
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

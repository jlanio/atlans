name: Question
description: Ask how to do something with Atlans.
labels: ["question"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you are trying to do
      description: The goal, not only the step you are stuck on.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: What you did so far, and what happened. Links to the docs you followed help.
    validations:
      required: true

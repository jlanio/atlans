name: Bug report
description: Something in Atlans does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Found a security issue? Do not file it here: follow [SECURITY.md](https://github.com/jlanio/atlans/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag (e.g. `v1.2.0`) or the commit SHA you are running.
      placeholder: v1.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Docker Compose
        - Desktop app
        - From source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step per line.
      placeholder: |
        1. Open the editor
        2. Add a ... block
        3. Run the workflow
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output (API, executor, browser console). Remove tokens, passwords and other secrets before pasting.
      render: shell
    validations:
      required: false

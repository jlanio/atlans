name: CI

on:
  push:
    branches: [main]
  # NO branch filter, on purpose. With `branches: [main]` here, a PR
  # opened against ANY other branch triggers no job at all — and GitHub
  # shows that PR as "clean", which is indistinguishable from "all green" to
  # whoever looks at the list. It happened on 2026-09-15 with a PR stacked on
  # another (two PRs touching the same four files): it reached ready-to-merge
  # with ZERO checks.
  #
  # Retargeting afterwards does not help: the base change emits `edited`, which
  # is not among the trigger's default activity types (`opened`, `synchronize`,
  # `reopened`). Without this fix, the only way out was pushing a real commit
  # just to wake CI up.
  #
  # The cost of running on PRs to any target is an extra job now and then;
  # the cost of not running is merging code nobody checked.
  pull_request:

# Read-only token in every job, and checkout without storing the token in
# .git/config (`persist-credentials: false`): no CI job writes to the
# repository, and a malicious package running inside an `npm ci` or
# `pip install` finds no credential here that can write. Actions are
# pinned by commit SHA (the comment states the version): a tag can be
# moved to other code by the action's owner, or by whoever steals their
# account; a SHA cannot. Dependabot updates both together.
permissions:
  contents: read

jobs:
  # Safety net in case the dev has not run `pre-commit install` locally.
  # Fails the build if a new secret (outside .secrets.baseline) shows up
  # in any committed file. Runs before the heavy jobs to fail
  # fast on a credential push.
  secrets-scan:
    name: Secrets scan (detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # From the dev lock, with hashes (the same version as the pre-commit hook).
      # It used to be `pip install detect-secrets==1.5.0` straight from PyPI: the
      # package unchecked and its dependencies at that day's newest version.
      - name: Install detect-secrets
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-dev.txt

      - name: Scan against baseline
        run: |
          # Save a copy of the current baseline before the scan (detect-secrets
          # rewrites the file with a new timestamp on every run).
          cp .secrets.baseline .secrets.baseline.pre

          detect-secrets scan --baseline .secrets.baseline

          # Compare only the `results` field (real hits) between pre and post
          # scan. Ignores `generated_at` (changes on every run) and plugin
          # order (may vary). Fails IF:
          #   - There are files with NEW hits (secret not captured in the
          #     HEAD baseline)
          #   - There are files already in the baseline with a secret the
          #     baseline does not know
          # A hit's identity is (type, hash) — on purpose WITHOUT the
          # line number. An already reviewed secret that merely moved
          # (a line inserted above it) is not a new leak, and before
          # this any edit to a baseline file broke CI.
          # Does NOT fail on "removed" hits — that may be a deleted file
          # or a secret that left the code. Both are safe.
          python -c "
          import json, sys
          with open('.secrets.baseline.pre') as f: before = json.load(f)
          with open('.secrets.baseline')     as f: after  = json.load(f)
          b_hits = before.get('results', {})
          a_hits = after.get('results',  {})
          key = lambda hits: {(h['type'], h['hashed_secret']) for h in hits}
          added = set(a_hits) - set(b_hits)
          shared_changed = set()
          for p in set(a_hits) & set(b_hits):
              if key(a_hits[p]) - key(b_hits[p]):
                  shared_changed.add(p)
          if added or shared_changed:
              print('::error::Segredos NOVOS detectados fora do .secrets.baseline')
              if added:          print(f'  Arquivos novos: {sorted(added)}')
              if shared_changed: print(f'  Arquivos com hits alterados: {sorted(shared_changed)}')
              print('Rode local: detect-secrets scan --baseline .secrets.baseline')
              print('  (no Windows: PYTHONUTF8=1 na frente, senao arquivos com')
              print('   acento sao pulados e o baseline sai incompleto)')
              print('Revise os hits, marque falsos positivos com')
              print('\"# pragma: allowlist secret\" e commite o baseline.')
              sys.exit(1)
          print('OK: nenhum segredo novo fora do baseline')
          "

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # The two LOCKS (generated from the .in files by scripts/travar_python.py), with
      # each file's hash: CI installs exactly the image's versions, and like the
      # image, wheels only (`--only-binary`) — a package that lost its wheel
      # would break here, in the PR, and not in the image build after the merge;
      # and no setup.py runs in CI. Without the earlier `pip install --upgrade pip`:
      # it was the only package that came in without a hash or quarantine; the
      # pinned pip comes in requirements-dev.txt.
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt

      # Before the tests: a broken import or an undefined name fails here in
      # seconds, and not only when (and if) the path runs. Rules in ruff.toml.
      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          APP_SECRET: "dGVzdC1zZWNyZXQta2V5LTMyY2hhcnMtbWluaW11bSE="
          # Throwaway key, generated only for the tests: no real environment uses it.
          FERNET_KEY: "o1Pjhb7ePrq8e2BSIWIcJsvfz1wZZV1CX6AVVNsBj74="  # pragma: allowlist secret
          SECRET_KEY: "test-secret-key-32chars-minimum!!"
        run: pytest tests/ -v

  # The server core with no extensions at all (app/extensoes), as the
  # free distribution runs it: each extension's folder and its tests are
  # DELETED first (scripts/sem_extensoes.sh), and the core suite runs in full.
  # A forgotten extension import in the core, one of its tables in
  # init_schema.sql, or a core test that depends on it fails here. A separate
  # job, not steps of the one above, so the second pass runs alongside the
  # first.
  backend-nucleo:
    name: Backend sem extensões (núcleo)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # With no extensions at all (the public repository, a fork), the cut
      # changes nothing and this job would repeat the one above: it ends here, green.
      - name: Há extensões?
        id: extensoes
        run: |
          if find app/extensoes web/extensoes -mindepth 1 -maxdepth 1 -type d ! -name '__pycache__' | grep -q .; then
            echo "tem=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sem extensões no repositório: o job Backend (Python) já cobre o núcleo."
            echo "tem=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.extensoes.outputs.tem == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.extensoes.outputs.tem == 'true'
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt

      - name: Tirar as extensões
        if: steps.extensoes.outputs.tem == 'true'
        run: bash scripts/sem_extensoes.sh

      - name: Run tests
        if: steps.extensoes.outputs.tem == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          APP_SECRET: "dGVzdC1zZWNyZXQta2V5LTMyY2hhcnMtbWluaW11bSE="
          # Throwaway key, generated only for the tests: no real environment uses it.
          FERNET_KEY: "o1Pjhb7ePrq8e2BSIWIcJsvfz1wZZV1CX6AVVNsBj74="  # pragma: allowlist secret
          SECRET_KEY: "test-secret-key-32chars-minimum!!"
        run: pytest tests/ -q

  # Known vulnerabilities in the dependencies. INFORMATIONAL for now: each
  # audit step has `continue-on-error`, so the job stays green; what it
  # finds becomes a warning (a `::warning::` annotation) and the report goes to
  # the run summary. Once the list reaches zero, removing `continue-on-error`
  # makes it blocking. Fixes arrive through the Dependabot PRs
  # (.github/dependabot.yml).
  #
  # Python: the locks already include the transitive ones, with hashes, so pip-audit
  # reads the versions straight from them (`--disable-pip`), without resolving or
  # installing anything. The executor lock is the same as the desktop app's. npm: only
  # the dependencies that go to production, straight from package-lock (no `npm ci`).
  #
  # And the age of the versions: the 14-day quarantine applies to what Dependabot
  # picks, not to the transitive ones pip-compile pulls into its PR, nor to a
  # security update. The step lists, as a warning, whatever is less than 14 days
  # old or was yanked from PyPI — that is what the review checklist
  # (CONTRIBUTING, "Dependabot PRs") says to look at first.
  #
  # No `cache: pip` on purpose: the default key is the Backend job's, and this
  # job, which finishes first, would store a small cache in place of its.
  audit:
    name: Auditoria de dependências (informativa)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar o pip-audit
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-dev.txt

      - name: Versões recentes nos locks Python
        continue-on-error: true
        run: python scripts/idade_dos_locks.py

      - name: pip-audit — API (requirements.txt)
        continue-on-error: true
        run: |
          status=0
          pip-audit -r requirements.txt --disable-pip --progress-spinner off -f markdown --desc off --aliases on > audit.md || status=$?
          { echo "### pip-audit — API (requirements.txt)"; if [ -s audit.md ]; then cat audit.md; else echo "Nenhuma vulnerabilidade conhecida."; fi; } >> "$GITHUB_STEP_SUMMARY"
          cat audit.md
          [ "$status" -eq 0 ] || echo "::warning title=pip-audit — API::vulnerabilidades conhecidas no requirements.txt; a lista está no resumo da execução"
          exit "$status"

      - name: pip-audit — executor e desktop (executor/requirements-full.txt)
        continue-on-error: true
        run: |
          status=0
          pip-audit -r executor/requirements-full.txt --disable-pip --progress-spinner off -f markdown --desc off --aliases on > audit.md || status=$?
          { echo "### pip-audit — executor e desktop (executor/requirements-full.txt)"; if [ -s audit.md ]; then cat audit.md; else echo "Nenhuma vulnerabilidade conhecida."; fi; } >> "$GITHUB_STEP_SUMMARY"
          cat audit.md
          [ "$status" -eq 0 ] || echo "::warning title=pip-audit — executor::vulnerabilidades conhecidas no lock do executor; a lista está no resumo da execução"
          exit "$status"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: npm audit — web
        continue-on-error: true
        working-directory: web
        run: |
          status=0
          npm audit --omit=dev --audit-level=high > audit.txt || status=$?
          { echo "### npm audit — web (dependências de produção)"; echo '```'; tail -n 60 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat audit.txt
          [ "$status" -eq 0 ] || echo "::warning title=npm audit — web::vulnerabilidades altas ou críticas; a lista está no resumo da execução"
          exit "$status"

      - name: npm audit — desktop
        continue-on-error: true
        working-directory: desktop
        run: |
          status=0
          npm audit --omit=dev --audit-level=high > audit.txt || status=$?
          { echo "### npm audit — desktop (dependências de produção)"; echo '```'; tail -n 60 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat audit.txt
          [ "$status" -eq 0 ] || echo "::warning title=npm audit — desktop::vulnerabilidades altas ou críticas; a lista está no resumo da execução"
          exit "$status"

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    # `next build` sends usage telemetry to Vercel by default.
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24, the LTS (until April 2028), the same as the web image
      # (web/Dockerfile.ui) and the desktop. 20 went out of support in April 2026,
      # and jsdom 30 and @testing-library/jest-dom 7 already require 22 or later.
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Until now the Vitest suite existed but nothing ran it: a
      # drive-field test stayed broken for 193 commits because CI only ran lint and
      # build. Tests nobody runs rot — this step is what makes them
      # a guarantee instead of decoration.
      - name: Test
        run: npm test

      - name: Build
        env:
          AUTH_SECRET: "ci-placeholder-secret-32chars-ok"  # pragma: allowlist secret
          AUTH_URL: "http://localhost"
          API_INTERNA: "http://localhost:8000"
        run: npm run build

  # The web core with no extensions at all (web/extensoes), as the free
  # distribution compiles, tests and builds it: scripts/sem_extensoes.sh DELETES
  # the extensions and their tests and empties the installed list, and then
  # the usual steps follow. A forgotten extension import in the core, with
  # any spelling, breaks here. A separate job, not steps of the one above, so
  # the second pass runs alongside the first.
  frontend-nucleo:
    name: Frontend sem extensões (núcleo)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in backend-nucleo: with no extensions, the job ends here.
      - name: Há extensões?
        id: extensoes
        working-directory: .
        run: |
          if find app/extensoes web/extensoes -mindepth 1 -maxdepth 1 -type d ! -name '__pycache__' | grep -q .; then
            echo "tem=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sem extensões no repositório: o job Frontend (Next.js) já cobre o núcleo."
            echo "tem=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js 24
        if: steps.extensoes.outputs.tem == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.extensoes.outputs.tem == 'true'
        run: npm ci

      - name: Tirar as extensões
        if: steps.extensoes.outputs.tem == 'true'
        run: bash ../scripts/sem_extensoes.sh

      - name: Typecheck
        if: steps.extensoes.outputs.tem == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.extensoes.outputs.tem == 'true'
        run: npm test

      - name: Build
        if: steps.extensoes.outputs.tem == 'true'
        env:
          AUTH_SECRET: "ci-placeholder-secret-32chars-ok"  # pragma: allowlist secret
          AUTH_URL: "http://localhost"
          API_INTERNA: "http://localhost:8000"
        run: npm run build

  # Quick check of the desktop app. It does NOT build the installer (~180 MB, ~10 min
  # of Windows runner) — that stays in desktop-windows.yml, triggered by tag.
  # Here only what breaks often: types, tests and the executor lock,
  # which the desktop runtime installs, on Windows.
  desktop:
    name: Desktop (typecheck + testes + lock)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Test
        working-directory: desktop
        run: npm test

      # The desktop runtime installs the executor lock
      # (executor/requirements-full.txt), resolved on Linux. The check installs it
      # in a clean Windows CPython, with --require-hashes and --only-binary: this
      # is where it is proven that every wheel exists for win_amd64 and matches the
      # hash, and that Windows does not need a dependency the lock lacks.
      # The CPython tarball (~40 MB) lives in resources/.cache and `fetch`
      # checks the SHA-256 before reusing it — with a cache hit, the
      # download does not happen. desktop-windows.yml already did this for the
      # assembled runtime; here only the tarball matters, because this job does not assemble it.
      - name: Cache do tarball do CPython
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/resources/.cache
          key: pytar-win-x64-${{ hashFiles('desktop/python-runtime.json') }}

      - name: Baixar o CPython (para validar o lock)
        working-directory: desktop
        run: npm run python:fetch

      - name: Lock do executor instala no Windows
        working-directory: desktop
        run: npm run python:lock:check

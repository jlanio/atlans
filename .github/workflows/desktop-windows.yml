# .github/workflows/desktop-windows.yml
#
# Build e publicação do app desktop (Windows x64).
#
# Trigger: push de tag `desktop/v*` (ex.: desktop/v2.0.0).
# Saída:   GitHub Release com o instalador NSIS, o `.blockmap` e o `latest.yml`.
#
# Os três artefatos são obrigatórios: sem `latest.yml` o electron-updater não
# encontra a versão nova, e sem o `.blockmap` ele rebaixa os ~180 MB inteiros em
# vez de só os blocos alterados.

name: Executor Desktop (Windows) — Build & Release

on:
  push:
    tags: ['desktop/v*']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar como GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    # O contexto `secrets` NAO existe em `if:` — o GitHub recusa o arquivo
    # inteiro com "Unrecognized named-value: 'secrets'", e o workflow nem chega
    # a rodar. Espelhar num `env` do job resolve, porque `env` VALE em `if:`.
    #
    # Guarda so a presenca, nunca o valor de um segredo real: os segredos em si
    # vao direto para o `env` do passo que os usa.
    env:
      ASSINATURA_LIGADA: ${{ secrets.ATLANS_SIGN_PROVIDER != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # ── Cache do tarball do CPython ────────────────────────────────────────
      # Só o tarball (~40 MB), que o `python:fetch` confere pelo SHA-256 do
      # python-runtime.json antes de usar: um cache adulterado não passa.
      #
      # O runtime MONTADO não vem de cache. Ele vai, assinado, para a máquina do
      # usuário, e uma entrada do cache do Actions pode ser envenenada por
      # código que rode em qualquer job da main: um runtime com pip e pacotes
      # alterados passaria pelo `pip install` como "já satisfeito" (arquivo já
      # instalado não é conferido pelo hash) e iria para o instalador. Então ele
      # é remontado a cada release, do tarball conferido e do lock com hash. (O
      # cache antigo, de `resources/python` já podado, nem servia num acerto:
      # o `fetch` saía cedo sem baixar o tarball, e o `build`, achando o
      # runtime sem pip, falhava por não ter de onde re-extrair.)
      - name: Cache do tarball do CPython
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/resources/.cache
          key: pytar-win-x64-${{ hashFiles('desktop/python-runtime.json') }}

      - name: Instalar dependências
        working-directory: desktop
        run: npm ci

      # O `fetch` confere o SHA-256 do tarball (do cache ou baixado) e extrai o
      # runtime limpo; o `build` instala o lock com --require-hashes e poda.
      - name: Baixar o CPython
        working-directory: desktop
        run: npm run python:fetch

      - name: Montar o runtime
        working-directory: desktop
        run: npm run python:build

      # `executor/` e `flow/` mudam a cada commit — e é justamente o import de
      # `flow` via o sys.path hack de job_executor.py que quebra quando alguém
      # mexe na árvore.
      - name: Copiar executor/ e flow/
        working-directory: desktop
        run: npm run payload:stage

      - name: Smoke do bundle Python
        working-directory: desktop
        run: npm run python:smoke

      # Prova a ponte inteira: spawn real, NDJSON pelo stdout, comando pelo
      # stdin. Não precisa de servidor — o executor falha na fase 0 e o teste
      # verifica que a falha chega como evento `state: failed` com causa.
      - name: Smoke do supervisor
        working-directory: desktop
        run: npm run smoke:supervisor

      - name: Typecheck e testes
        working-directory: desktop
        run: |
          npm run typecheck
          npm test

      # Assina um binário de mentira com um certificado autoassinado e confere a
      # assinatura resultante. Roda SEM segredo nenhum, e é o que garante que o
      # hook de assinatura continua funcional enquanto ele é um no-op — o risco
      # aqui nunca foi técnico, foi de cronograma: descobrir que o hook quebrou
      # no dia em que o certificado chega.
      - name: Autoteste do hook de assinatura
        working-directory: desktop
        run: npm run sign:selftest

      # O build do app (tsc, esbuild, vite, tailwind — código de terceiros) roda
      # SEM segredo nenhum no ambiente. O token de escrita e os segredos de
      # assinatura só entram no passo seguinte, que é só o electron-builder.
      # Antes os dois iam juntos no `npm run dist`.
      # O servidor e a UI que o app grava no executável vêm das variáveis do
      # repositório (Settings → Secrets and variables → Actions → Variables): o
      # código não traz os de instalação nenhuma, e o build falha sem eles
      # (desktop/scripts/enderecos.mjs).
      - name: Compilar o app
        working-directory: desktop
        env:
          ATLANS_DESKTOP_SERVIDOR: ${{ vars.ATLANS_DESKTOP_SERVIDOR }}
          ATLANS_DESKTOP_UI_URL: ${{ vars.ATLANS_DESKTOP_UI_URL }}
        run: npm run build

      - name: Gerar o instalador
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura de código. Sem os segredos, `build/sign.cjs` é no-op e o
          # instalador sai funcional porém não assinado (SmartScreen alerta).
          # Um fork sem segredos continua conseguindo buildar — é por isso que
          # nada aqui é obrigatório.
          #
          # Para Azure Trusted Signing / DigiCert KeyLocker, use PROVIDER=dlib e
          # aponte ATLANS_SIGNTOOL para o signtool do SDK: o que vem no
          # winCodeSign do electron-builder não conhece `/dlib`.
          ATLANS_SIGN_PROVIDER: ${{ secrets.ATLANS_SIGN_PROVIDER }}
          ATLANS_SIGN_PFX: ${{ secrets.ATLANS_SIGN_PFX }}
          ATLANS_SIGN_PFX_PASSWORD: ${{ secrets.ATLANS_SIGN_PFX_PASSWORD }}
          ATLANS_SIGN_DLIB: ${{ secrets.ATLANS_SIGN_DLIB }}
          ATLANS_SIGN_DLIB_METADATA: ${{ secrets.ATLANS_SIGN_DLIB_METADATA }}
          ATLANS_SIGNTOOL: ${{ secrets.ATLANS_SIGNTOOL }}
          # O feed do auto-update é o deste repositório: cada fork publica nas
          # próprias releases, e o app instalado busca atualização nelas
          # (desktop/electron-builder.yml). Por env, e não por `-c.publish.*`
          # na linha de comando: o pwsh deste runner parte `-c.publish.owner=x`
          # no primeiro ponto, e o electron-builder recebia `-c` e `.publish...`.
          ATLANS_RELEASES_DONO: ${{ github.repository_owner }}
          ATLANS_RELEASES_REPO: ${{ github.event.repository.name }}
        run: npm run empacotar

      # Só quando a assinatura estava ligada: um instalador que DEVERIA sair
      # assinado e sai sem assinatura chega ao usuário com o aviso do
      # SmartScreen, e ninguém percebe até o primeiro chamado de suporte.
      - name: Conferir a assinatura do instalador
        if: env.ASSINATURA_LIGADA == 'true'
        working-directory: desktop
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist-installer/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "status=$($sig.Status) subject=$($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Instalador nao assinado ou com assinatura invalida: $($sig.Status)"
          }
          if (-not $sig.TimeStamperCertificate) {
            throw "Assinado SEM carimbo de tempo — expiraria junto com o certificado."
          }

      - name: Publicar artefatos do build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlans-executor-windows
          path: |
            desktop/dist-installer/*.exe
            desktop/dist-installer/*.blockmap
            desktop/dist-installer/latest.yml
          retention-days: 14

      # O texto da release sai de um passo: o parágrafo do SmartScreen só vale
      # para um build sem assinatura, e a expressão do `body:` não condiciona
      # um bloco inteiro.
      - name: Montar o texto da release
        if: startsWith(github.ref, 'refs/tags/desktop/v') || inputs.publicar
        shell: pwsh
        run: |
          $texto = @"
          App desktop do executor Atlans para **Windows x64**.

          Traz o Python embarcado e o motor de workflows — não precisa de
          Docker, Git nem Python instalado na máquina.

          ### Instalação
          Baixe e execute o ``.exe``. A instalação é por usuário
          (``%LOCALAPPDATA%\Programs``), sem privilégio de administrador.

          O app pede o **ID do executor** e um **OTP**, ambos gerados no
          painel em **Executores → Gerar OTP**.
          "@
          if ($env:ASSINATURA_LIGADA -ne 'true') {
            $texto += @"


          ### Aviso do SmartScreen
          Este build **não é assinado**. O Windows exibirá "O Windows protegeu
          o computador" — clique em *Mais informações* → *Executar assim
          mesmo*.
          "@
          }
          Set-Content -Path desktop/dist-installer/release-body.md -Value $texto -Encoding utf8

      - name: Criar a Release
        if: startsWith(github.ref, 'refs/tags/desktop/v') || inputs.publicar
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Atlans Executor ${{ github.ref_name }}
          files: |
            desktop/dist-installer/*.exe
            desktop/dist-installer/*.exe.blockmap
            desktop/dist-installer/latest.yml
          body_path: desktop/dist-installer/release-body.md

# .github/workflows/desktop-windows.yml
#
# Build and release of the desktop app (Windows x64).
#
# Trigger: push of a `desktop/v*` tag (e.g.: desktop/v2.0.0).
# Output:  GitHub Release with the NSIS installer, the `.blockmap` and `latest.yml`.
#
# All three artifacts are required: without `latest.yml` electron-updater does not
# find the new version, and without the `.blockmap` it re-downloads the whole ~180 MB
# instead of only the changed blocks.

name: Executor Desktop (Windows) — Build & Release

on:
  push:
    tags: ['desktop/v*']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar como GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    # The `secrets` context does NOT exist in `if:` — GitHub rejects the whole
    # file with "Unrecognized named-value: 'secrets'", and the workflow never
    # even runs. Mirroring it into a job `env` solves it, because `env` IS valid in `if:`.
    #
    # It stores only the presence, never the value of a real secret: the secrets
    # themselves go straight into the `env` of the step that uses them.
    env:
      ASSINATURA_LIGADA: ${{ secrets.ATLANS_SIGN_PROVIDER != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # ── CPython tarball cache ──────────────────────────────────────────────
      # Only the tarball (~40 MB), which `python:fetch` checks against the SHA-256 in
      # python-runtime.json before use: a tampered cache does not get through.
      #
      # The ASSEMBLED runtime does not come from cache. It goes, signed, to the
      # user's machine, and an Actions cache entry can be poisoned by
      # code running in any job on main: a runtime with altered pip and packages
      # would pass `pip install` as "already satisfied" (an already installed
      # file is not checked against the hash) and end up in the installer. So it
      # is reassembled on every release, from the checked tarball and the hashed
      # lock. (The old cache, of an already pruned `resources/python`, did not even
      # work on a hit: `fetch` exited early without downloading the tarball, and
      # `build`, finding the runtime without pip, failed with nowhere to re-extract from.)
      - name: Cache do tarball do CPython
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/resources/.cache
          key: pytar-win-x64-${{ hashFiles('desktop/python-runtime.json') }}

      - name: Instalar dependências
        working-directory: desktop
        run: npm ci

      # `fetch` checks the tarball's SHA-256 (cached or downloaded) and extracts the
      # clean runtime; `build` installs the lock with --require-hashes and prunes.
      - name: Baixar o CPython
        working-directory: desktop
        run: npm run python:fetch

      - name: Montar o runtime
        working-directory: desktop
        run: npm run python:build

      # `executor/` and `flow/` change on every commit — and it is precisely the
      # `flow` import through job_executor.py's sys.path hack that breaks when
      # someone touches the tree.
      - name: Copiar executor/ e flow/
        working-directory: desktop
        run: npm run payload:stage

      - name: Smoke do bundle Python
        working-directory: desktop
        run: npm run python:smoke

      # Proves the whole bridge: real spawn, NDJSON over stdout, commands over
      # stdin. It needs no server — the executor fails at phase 0 and the test
      # checks that the failure arrives as a `state: failed` event with a cause.
      - name: Smoke do supervisor
        working-directory: desktop
        run: npm run smoke:supervisor

      - name: Typecheck e testes
        working-directory: desktop
        run: |
          npm run typecheck
          npm test

      # Signs a fake binary with a self-signed certificate and checks the
      # resulting signature. Runs with NO secrets at all, and it is what ensures the
      # signing hook keeps working while it is a no-op — the risk here was
      # never technical, it was about schedule: finding out the hook broke
      # on the day the certificate arrives.
      - name: Autoteste do hook de assinatura
        working-directory: desktop
        run: npm run sign:selftest

      # The app build (tsc, esbuild, vite, tailwind — third-party code) runs
      # with NO secrets at all in the environment. The write token and the signing
      # secrets only come in at the next step, which is electron-builder alone.
      # They used to go together in `npm run dist`.
      # The server and UI the app bakes into the executable come from the
      # repository variables (Settings → Secrets and variables → Actions → Variables):
      # the code ships those of no installation, and the build fails without them
      # (desktop/scripts/enderecos.mjs).
      - name: Compilar o app
        working-directory: desktop
        env:
          ATLANS_DESKTOP_SERVIDOR: ${{ vars.ATLANS_DESKTOP_SERVIDOR }}
          ATLANS_DESKTOP_UI_URL: ${{ vars.ATLANS_DESKTOP_UI_URL }}
        run: npm run build

      - name: Gerar o instalador
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing. Without the secrets, `build/sign.cjs` is a no-op and the
          # installer comes out functional but unsigned (SmartScreen warns).
          # A fork without secrets can still build — that is why
          # nothing here is required.
          #
          # For Azure Trusted Signing / DigiCert KeyLocker, use PROVIDER=dlib and
          # point ATLANS_SIGNTOOL to the SDK's signtool: the one in electron-builder's
          # winCodeSign does not know `/dlib`.
          ATLANS_SIGN_PROVIDER: ${{ secrets.ATLANS_SIGN_PROVIDER }}
          ATLANS_SIGN_PFX: ${{ secrets.ATLANS_SIGN_PFX }}
          ATLANS_SIGN_PFX_PASSWORD: ${{ secrets.ATLANS_SIGN_PFX_PASSWORD }}
          ATLANS_SIGN_DLIB: ${{ secrets.ATLANS_SIGN_DLIB }}
          ATLANS_SIGN_DLIB_METADATA: ${{ secrets.ATLANS_SIGN_DLIB_METADATA }}
          ATLANS_SIGNTOOL: ${{ secrets.ATLANS_SIGNTOOL }}
          # The auto-update feed is this repository's: each fork publishes to its
          # own releases, and the installed app looks for updates there
          # (desktop/electron-builder.yml). Via env, not via `-c.publish.*`
          # on the command line: this runner's pwsh splits `-c.publish.owner=x`
          # at the first dot, and electron-builder received `-c` and `.publish...`.
          ATLANS_RELEASES_DONO: ${{ github.repository_owner }}
          ATLANS_RELEASES_REPO: ${{ github.event.repository.name }}
        run: npm run empacotar

      # Only when signing was on: an installer that SHOULD come out
      # signed and comes out unsigned reaches the user with the
      # SmartScreen warning, and nobody notices until the first support ticket.
      - name: Conferir a assinatura do instalador
        if: env.ASSINATURA_LIGADA == 'true'
        working-directory: desktop
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist-installer/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "status=$($sig.Status) subject=$($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Instalador nao assinado ou com assinatura invalida: $($sig.Status)"
          }
          if (-not $sig.TimeStamperCertificate) {
            throw "Assinado SEM carimbo de tempo — expiraria junto com o certificado."
          }

      - name: Publicar artefatos do build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlans-executor-windows
          path: |
            desktop/dist-installer/*.exe
            desktop/dist-installer/*.blockmap
            desktop/dist-installer/latest.yml
          retention-days: 14

      # The release text comes from a step: the SmartScreen paragraph only applies
      # to an unsigned build, and the `body:` expression cannot make a whole
      # block conditional.
      - name: Montar o texto da release
        if: startsWith(github.ref, 'refs/tags/desktop/v') || inputs.publicar
        shell: pwsh
        run: |
          $texto = @"
          App desktop do executor Atlans para **Windows x64**.

          Traz o Python embarcado e o motor de workflows — não precisa de
          Docker, Git nem Python instalado na máquina.

          ### Instalação
          Baixe e execute o ``.exe``. A instalação é por usuário
          (``%LOCALAPPDATA%\Programs``), sem privilégio de administrador.

          O app pede o **ID do executor** e um **OTP**, ambos gerados no
          painel em **Executores → Gerar OTP**.
          "@
          if ($env:ASSINATURA_LIGADA -ne 'true') {
            $texto += @"


          ### Aviso do SmartScreen
          Este build **não é assinado**. O Windows exibirá "O Windows protegeu
          o computador" — clique em *Mais informações* → *Executar assim
          mesmo*.
          "@
          }
          Set-Content -Path desktop/dist-installer/release-body.md -Value $texto -Encoding utf8

      - name: Criar a Release
        if: startsWith(github.ref, 'refs/tags/desktop/v') || inputs.publicar
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Atlans Executor ${{ github.ref_name }}
          files: |
            desktop/dist-installer/*.exe
            desktop/dist-installer/*.exe.blockmap
            desktop/dist-installer/latest.yml
          body_path: desktop/dist-installer/release-body.md

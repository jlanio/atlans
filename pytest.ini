[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    sem_indice_de_pin: roda contra uma base que ainda nao migrou o indice unico parcial de pin-cache (`uq_artifact_pin_por_no`). O deploy nao roda migracao, entao essa base existe em producao ate alguem rodar `alembic upgrade head` — e a tolerancia a duplicata no codigo existe para ela.

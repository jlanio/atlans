http:
  middlewares:
    # The EDGE middleware of the public hosts' routers (PUBLIC_HOST and
    # S3_HOST) is the one BORDA_MIDDLEWARE in .env picks: this one, in an install
    # behind Cloudflare, or `borda-aberta` (below), without a CDN.
    #
    # SEC (CRITICAL), behind Cloudflare: only connections coming from its published
    # ranges get into the proxied hosts' routers. The executors' host is DNS-only
    # on purpose (the executors' mTLS does not go through Cloudflare) — and that
    # publishes the origin IP. Since it is the SAME Traefik that serves the public host,
    # without this list `curl --resolve <host>:443:<ip-do-origin>` was enough to
    # talk to Next.js and the API bypassing Cloudflare: no WAF, no edge rate
    # limit, and with the IP exposed to DDoS.
    #
    # No ipStrategy ON PURPOSE: what is checked is the TCP peer (the Cloudflare
    # edge), never X-Forwarded-For — which is exactly what a client
    # hitting the origin directly would write. NEVER chain this into the routers of the
    # executors' host: executors connect from any network.
    #
    # Ranges from https://www.cloudflare.com/ips/ — the same list as the example for
    # BORDA_FAIXAS_CONFIAVEIS (.env.example, the `forwardedHeaders.trustedIPs` in
    # docker-compose.yml) and CLOUDFLARE_RANGES (app/core/trusted_proxy.py);
    # test_traefik_config.py enforces that all three match.
    cloudflare-only:
      ipAllowList:
        sourceRange:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32
    # Edge for an install with NO CDN in front: Traefik is the edge itself, and
    # any IP gets in (the rate limit and each router's middlewares still
    # apply). It is the default for BORDA_MIDDLEWARE.
    borda-aberta:
      ipAllowList:
        sourceRange:
          - 0.0.0.0/0
          - ::/0

    # ── Rate limits, per client IP ────────────────────────────────────────
    #
    # Where "the client IP" comes from depends on whether there is a trusted proxy
    # in front of Traefik, so each limit of the public routers exists
    # in TWO forms, chosen by the same BORDA_MIDDLEWARE from .env (the
    # compose labels reference `rate-mcp-${BORDA_MIDDLEWARE}` and
    # `rate-download-${BORDA_MIDDLEWARE}`):
    #
    #   -borda-aberta     no CDN: Traefik is the edge, and the client IP is the
    #                     connection's (no sourceCriterion = RemoteAddr).
    #   -cloudflare-only  behind Cloudflare: the client IP is the last one
    #                     IT appended to X-Forwarded-For (ipStrategy.depth: 1);
    #                     Traefik only keeps that header from peers in
    #                     forwardedHeaders.trustedIPs (BORDA_FAIXAS_CONFIAVEIS).
    #
    # `ipStrategy.depth: 1` in an install with NO CDN is not "per IP": for a
    # peer outside trustedIPs Traefik DELETES X-Forwarded-For before the
    # middlewares and only appends the client IP in the proxy, after them — the source
    # of the limit ends up empty and ALL clients fall into a single bucket (one client
    # at 300 req/min took /mcp down for everyone). Whoever defines another edge
    # (their own `minha-cdn`) also defines `rate-mcp-minha-cdn` and
    # `rate-download-minha-cdn`, with the criterion that holds for it.
    #
    # /internal (the executors' host) has no variant: executors
    # connect directly in any install (mTLS does not go through a CDN), and the IP
    # is always the connection's.

    # /internal (send-email) — 10 req/min per executor (connection IP)
    rate-internal:
      rateLimit:
        average: 10
        burst: 5
        period: 1m

    # /artifacts/*/download — 30 req/min por IP
    rate-download-borda-aberta:
      rateLimit:
        average: 30
        burst: 10
        period: 1m
    rate-download-cloudflare-only:
      rateLimit:
        average: 30
        burst: 10
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    # /mcp — 240 req/min per IP.
    # Coarse edge ceiling on purpose: the quota that matters is the per-token one
    # (app/mcp/cotas.py, 120 calls/min), and several agents behind the same NAT
    # share an IP. It is there to contain a flood, not to meter usage.
    rate-mcp-borda-aberta:
      rateLimit:
        average: 240
        burst: 60
        period: 1m
    rate-mcp-cloudflare-only:
      rateLimit:
        average: 240
        burst: 60
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    # SEC (CRITICAL): removes any X-Forwarded-Tls-Client-Cert-Info the
    # CLIENT may have sent. Traefik's passTLSClientCert only does `Set` when
    # there is a peer certificate — it NEVER does `Del`. Since clientAuthType is
    # VerifyClientCertIfGiven (connecting without a cert is allowed), a client with no
    # cert at all would have the forged header passed intact to the backend, which
    # derives the executor's ENTIRE identity from it => full mTLS bypass.
    #
    # customRequestHeaders with an empty value removes the header in Traefik v3.
    # MUST be chained BEFORE pass-executor-cert in every router, and also
    # on its own in routers that do not use mTLS (otherwise the header passes straight through).
    strip-executor-cert-header:
      headers:
        customRequestHeaders:
          X-Forwarded-Tls-Client-Cert-Info: ""
          X-Forwarded-Tls-Client-Cert: ""

    # Passes info from the validated mTLS cert to the backend via the
    # X-Forwarded-Tls-Client-Cert-Info header. FastAPI parses CN and Serial.
    pass-executor-cert:
      passTLSClientCert:
        info:
          subject:
            commonName: true
          serialNumber: true
          sans: false

tls:
  # Automatic SNI matching:
  #   PUBLIC_HOST and S3_HOST -> site cert (SSL_CERT_DIR: the Cloudflare
  #                            origin one, a Let's Encrypt one or another)
  #   AGENTS_HOST           -> internal CA cert (DNS-only, executor mTLS),
  #                            which scripts/bootstrap-stepca.sh writes as
  #                            agents.crt/agents.key
  # A missing agents.crt only produces an error line in the Traefik log; the
  # other certificates still apply. The site cert is different: it is also the
  # default store's certificate (below), and without it that store does not
  # load and Traefik serves no certificate at all on PUBLIC_HOST and S3_HOST
  # (the browser shows nothing, not even a warning). make bootstrap and
  # make up-prod write a provisional self-signed one when both files are
  # missing (scripts/lib/cert.sh).
  certificates:
    - certFile: /etc/ssl/cloudflare/cert.pem
      keyFile:  /etc/ssl/cloudflare/key.pem
    - certFile: /etc/ssl/atlans-ca/agents.crt
      keyFile:  /etc/ssl/atlans-ca/agents.key

  options:
    # Optional mTLS for all routers of the executors' host.
    #
    # Why VerifyClientCertIfGiven instead of RequireAndVerifyClientCert:
    # Traefik requires uniform TLS options per host — if one executor router uses
    # mTLS-required and another router (UI, /executores/enroll, etc.) does not, it
    # detects a conflict and disables mTLS on ALL of them. Solution: the default option
    # accepts an optional cert + validates it when present. The backend (get_agent_from_mtls)
    # blocks executor endpoints that do not receive X-Forwarded-Tls-Client-Cert-Info.
    #
    # IMPORTANT: if the executors' host is behind a CDN (the Cloudflare
    # proxy, for example), the executor's cert does NOT reach Traefik — the CDN
    # terminates TLS at the edge.
    # For mTLS to work, either the executors' subdomain stays DNS-only on CF,
    # or you use Cloudflare Authenticated Origin Pulls + a separate path.
    mtls-executores:
      clientAuth:
        caFiles:
          - /etc/ssl/atlans-ca/intermediate.crt
        clientAuthType: VerifyClientCertIfGiven
      # TLS 1.3 mandatory. Legacy TLS 1.2 cipher suites are left out —
      # CHACHA20-Poly1305 and AES-GCM are the TLS 1.3 defaults (no downgrade).
      minVersion: VersionTLS13
      curvePreferences:
        - X25519
        - CurveP256

  # Default fallback (direct access by IP or hostname with no SNI match)
  stores:
    default:
      defaultCertificate:
        certFile: /etc/ssl/cloudflare/cert.pem
        keyFile:  /etc/ssl/cloudflare/key.pem

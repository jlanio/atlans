# Python lint — the CI's "Backend (Python)" job runs `ruff check` before
# pytest. For now only the pyflakes rules (F): undefined name, broken or
# unused import, unused variable, f-string without a field. That is what catches,
# in the PR, the error that would only blow up in production when the path ran.
# Other rule families come in gradually, each in its own PR.
# `py312`: the version of the API, the executor, CI and the desktop app runtime.
target-version = "py312"

[lint]
select = ["F"]

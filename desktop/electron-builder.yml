appId: app.atlans.executor
productName: Atlans Executor
copyright: Copyright © 2026 os autores do Atlans

directories:
  output: dist-installer
  buildResources: build

# Only packages what came out of `npm run build`, not the dist/main from
# `npm run dev` (which points at the local machine). See build/antes-de-empacotar.cjs.
beforePack: build/antes-de-empacotar.cjs

files:
  - dist/**/*
  - build/*.ico
  - package.json
  # node_modules comes in through electron-builder's default (only the
  # dependencies, not the devDependencies).

# The Python payload stays OUTSIDE the asar: it is ~390 MB of files the
# interpreter needs to open through the real filesystem. Inside the asar,
# python.exe simply does not see them.
extraResources:
  - from: resources/python
    to: python
  - from: resources/executor
    to: executor
  - from: resources/flow
    to: flow
  - from: resources/payload.json
    to: payload.json
  # The Atlans license and the third-party notices (scripts/payload-stage.mjs
  # copies them to resources/). Electron and Chromium ship with their own.
  - from: resources/LICENSE.txt
    to: LICENSE.txt
  - from: resources/THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # No elevation: the installation is per-user, in %LOCALAPPDATA%. Asking for
  # admin in an app that does not need it adds a UAC prompt with "Unknown
  # publisher" as long as there is no signing certificate.
  requestedExecutionLevel: asInvoker
  # Signing hook. It is a no-op without ATLANS_SIGN_PROVIDER in the environment,
  # so the local build and the CI build without secrets come out unsigned and
  # functional. See build/sign.cjs for how to enable it.
  #
  # It goes inside `signtoolOptions`, not loose in `win`: electron-builder 25
  # still accepts the old form, but emits a deprecated-field warning for every
  # signed file.
  #
  # The extension is `.cjs` because package.json declares `"type": "module"` —
  # a `.js` would be loaded as ESM and the `exports.default` electron-builder
  # looks for would not exist, with a module resolver stack trace that does
  # not mention ESM anywhere.
  signtoolOptions:
    sign: build/sign.cjs

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Atlans Executor
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Config, certificates and artifacts live in %APPDATA%/%USERPROFILE% and
  # survive uninstallation on purpose: reinstalling should not require a new
  # enrollment nor delete the user's working artifacts.
  deleteAppDataOnUninstall: false

# Deep link atlans://enroll?... — eliminates copy-pasting the OTP between the
# web panel and the app. The handler is registered by NSIS at install time;
# origin validation (confirmation dialog + host allowlist) belongs to Phase 4.
protocols:
  - name: Atlans Studio
    schemes: [atlans]

# The auto-update feed baked into the app (app-update.yml) is the GitHub
# repository whose releases carry the installer. The owner and the name come
# from the build environment: in CI, the publishing repository
# (.github/workflows/desktop-windows.yml), and each fork updates from its own
# releases. Without the two variables the build stops
# ("env ATLANS_RELEASES_DONO is not defined") instead of producing an app that
# never updates: electron-builder does not infer them from git, because
# desktop/ has no .git of its own.
publish:
  provider: github
  owner: ${env.ATLANS_RELEASES_DONO}
  repo: ${env.ATLANS_RELEASES_REPO}
  releaseType: release

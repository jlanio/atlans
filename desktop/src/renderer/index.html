<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP restritiva: o painel de log exibe texto vindo de nós de workflow, que
      executam código arbitrário do usuário. Sem `unsafe-inline` em script, e
      sem nenhuma origem externa — o app é 100% local e não deve nunca buscar
      nada na rede a partir do renderer.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
    <title>Atlans Executor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

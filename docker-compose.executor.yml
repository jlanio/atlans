# ═══════════════════════════════════════════════════════════════════════════════
#  Atlans Executor — Docker Compose
# ═══════════════════════════════════════════════════════════════════════════════
#
# ── How to use (mTLS + Bootstrap OTP) ─────────────────────────────────────────
#
#   1. Admin: creates the executor on the platform and generates an OTP via
#      POST /executores/{executor_id}/enroll-otp (valid 24h, single use)
#   2. Operator: copies EXECUTOR_ID + OTP over a secure channel (1Password, Signal)
#   3. Before the first `up`, run the enrollment outside the container:
#
#        python -m executor enroll --otp=<OTP> --server=https://<AGENTS_HOST> \
#                                  --cert-dir=./executor-certs
#
#      This generates ./executor-certs/{cert,chain,ca,key,x25519_key}.pem
#   4. Paste EXECUTOR_ID below in the field marked COLE_AQUI
#   5. Adjust EXECUTOR_SERVER_URL and mount ./executor-certs in the container
#   6. Start:
#
#        docker compose -f docker-compose.executor.yml up -d --build
#
# ── Useful commands ───────────────────────────────────────────────────────────
#
#   Logs:       docker compose -f docker-compose.executor.yml logs -f
#   Restart:    docker compose -f docker-compose.executor.yml restart
#   Stop:       docker compose -f docker-compose.executor.yml down
#   Rebuild:    docker compose -f docker-compose.executor.yml up -d --build
#
# ── Notes ─────────────────────────────────────────────────────────────────────
#
#   • The private key and the server key are obtained automatically.
#   • The executor restarts automatically on a crash (restart: on-failure);
#     a revoked executor exits with code 0 and stays stopped (no restart).
#   • GeoSync: available only for dedicated executors. Mount the volume and
#     set EXECUTOR_SYNC_DIRS to enable it.
#
# ═══════════════════════════════════════════════════════════════════════════════

services:
  executor:
    # For the release image (docker load < atlans-executor-docker-amd64.tar.gz):
    # image: atlans-executor:latest, in place of the build.
    build:
      context: .
      dockerfile: Dockerfile.executor
      args:
        # The version the dashboard shows (2.15.0+3f02f44) comes from the checkout
        # itself at build time (executor/versao.py). EXECUTOR_COMMIT only if you
        # need to force another value.
        EXECUTOR_COMMIT: ${EXECUTOR_COMMIT:-}
    # It used to be `atlas-executor` (without the n). Compose recreates the
    # container with the new name on the next `up -d`; the `executor-data`
    # volume (certs, keys, artifacts) is the same, so the enrollment remains
    # valid. An old container created by `docker run` (outside compose) needs
    # `docker rm -f atlas-executor` first — install.sh does that.
    container_name: atlans-executor
    # on-failure: restarts on a crash (exit != 0). A revoked one exits with 0 → stops.
    restart: on-failure

    env_file: executor/.env

    environment:
      # Overrides specific to the Docker container
      - EXECUTOR_ARTIFACTS_DIR=/data/artifacts
      - LOG_COLOR=never #auto, always, never
      # Live dashboard explicitly turned off. Without `-it` it would not turn on
      # anyway (stdout is not a TTY), and LOG_COLOR=never also turns it off — but
      # relying on a side effect is fragile for whoever reads this file later.
      - EXECUTOR_DASHBOARD=off
      # Persistent mTLS cert — populated by `python -m executor enroll` before the up.
      - EXECUTOR_CERT_DIR=/data/certs
      # GeoSync (optional): uncomment together with the sync volume below to
      # enable it. Empty = GeoSync disabled (default).
      # - EXECUTOR_SYNC_DIRS=/data/sync

      # HOST_ALIASES — rewriting of internal Docker hostnames
      # - EXECUTOR_HOST_ALIASES=db=host.docker.internal:5432,redis=host.docker.internal:6379

    volumes:
      # Dados persistentes (cert mTLS + chaves + artefatos)
      - executor-data:/data

      # Bind of the certs generated by enroll on the host → /data/certs in the container.
      # Comment out this mount if you generated the certs INSIDE the container.
      #- ./executor-certs:/data/certs:ro

      # ── GeoSync (optional) ───────────────────────────────────────────────
      # Syncs a local folder on the host with the workspace Drive.
      # Use the LONG SYNTAX below — it avoids the "invalid volume specification"
      # error on Windows (where the ':' of the drive letter, e.g. D:, collides
      # with the host:container separator of the short syntax). Edit `source`
      # to the path on YOUR machine and uncomment EXECUTOR_SYNC_DIRS in the
      # environment section:
      #   Windows: D:\drive   (or D:/drive)
      #   Linux:   /home/usuario/drive
      #   macOS:   /Users/usuario/drive
      #- type: bind
      #  source: /caminho/no/host
      #  target: /data/sync

    # Access to the host from inside the container (the host's localhost)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Perfil seccomp — bloqueia syscalls perigosas (mount, ptrace, reboot, etc.)
    security_opt:
      - seccomp:security/seccomp-executor.json

    # Network shared with the server (access to MinIO via internal hostname)
    networks:
      - atlans-backend

    # Resource limits
    #
    # Memory: EXECUTOR_MEMORIA, read from the .env NEXT TO this file (compose
    # interpolates from there). The installer (static/install.sh) writes 75% of
    # the memory Docker sees (minimum 2G); without it, 2G. The fixed 2G killed
    # the executor through a cgroup OOM on a 16 GB machine with 13 GB free — and
    # the job in progress was left without an outcome. To change it on an
    # executor that is already installed:
    #   echo EXECUTOR_MEMORIA=12G >> .env && docker compose -f docker-compose.executor.yml up -d
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: ${EXECUTOR_MEMORIA:-2G}
        reservations:
          cpus: "0.5"
          memory: 512M

networks:
  atlans-backend:
    driver: bridge

volumes:
  executor-data:
